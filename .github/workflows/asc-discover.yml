name: App Store Connect lookup

# Reads, with the App Store Connect API key in the repo secrets, the apps and App IDs on the account and prints their
# names, bundle IDs and team prefix (none of these is secret). Nothing is created or changed. Never prints the key.
on:
  push:
    paths: [".github/workflows/asc-discover.yml"]
  workflow_dispatch:

jobs:
  lookup:
    runs-on: ubuntu-24.04
    steps:
      - name: Which secrets are set (names only)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for n in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID; do
            if [ -n "${!n}" ]; then echo "$n: set"; else echo "$n: MISSING"; fi
          done
          case "$ASC_KEY_P8" in *"BEGIN PRIVATE KEY"*) echo "ASC_KEY_P8 looks like a .p8 key";; *) echo "ASC_KEY_P8 does not contain a PEM private key header";; esac
      - name: List apps and App IDs
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install --quiet pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests
          kid, iss, key = os.environ["ASC_KEY_ID"].strip(), os.environ["ASC_ISSUER_ID"].strip(), os.environ["ASC_KEY_P8"]
          tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           key, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          h = {"Authorization": f"Bearer {tok}"}
          r = requests.get("https://api.appstoreconnect.apple.com/v1/apps?limit=200&fields[apps]=name,bundleId,sku", headers=h)
          print("apps:", r.status_code)
          if r.ok:
              for a in r.json()["data"]: print(f"  APP  name={a['attributes']['name']!r}  bundleId={a['attributes']['bundleId']}")
          else: print(r.text[:500])
          r = requests.get("https://api.appstoreconnect.apple.com/v1/bundleIds?limit=200&fields[bundleIds]=name,identifier,platform,seedId", headers=h)
          print("bundleIds:", r.status_code)
          if r.ok:
              for b in r.json()["data"]:
                  a = b["attributes"]; print(f"  ID   name={a['name']!r}  identifier={a['identifier']}  platform={a['platform']}  teamPrefix={a.get('seedId')}")
          else: print(r.text[:500])
          PY
