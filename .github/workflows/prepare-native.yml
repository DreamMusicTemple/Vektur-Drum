name: Prepare native Swift package

on:
  push:
    branches: [ "native/prepare-swift-package" ]
    paths:
      - ".github/workflows/prepare-native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source and apply the two reviewed Swift fixes
        shell: bash
        run: |
          set -euo pipefail
          test -f VekturDrum-0.9.1.zip
          unzip -q VekturDrum-0.9.1.zip
          test -f VekturDrum/native/Package.swift
          python3 - <<'PY'
          from pathlib import Path
          p = Path("VekturDrum/native/Sources/VekturDrumCore/FactoryKits.swift")
          s = p.read_text()
          old = "public static func load(bundle: Bundle = .module) -> [Kit] {"
          new = """public static func load() -> [Kit] { load(bundle: .module) }

              public static func load(bundle: Bundle) -> [Kit] {"""
          if old not in s:
              raise SystemExit("A1: expected FactoryKits signature not found; refusing to guess")
          p.write_text(s.replace(old, new, 1))

          p = Path("VekturDrum/native/Sources/VekturDrumCore/Persistence.swift")
          s = p.read_text()
          import re
          match = re.search(r"(?m)^public struct DecodedSample\\b", s)
          if not match:
              raise SystemExit("A2: anchored DecodedSample declaration not found")
          start = match.start()
          end = s.find("\\n}", start)
          if end < 0:
              raise SystemExit("A2: could not locate DecodedSample closing brace")
          block = s[start:end]
          if "public init(channels:" not in block:
              init = """
              public init(channels: [[Float]], sampleRate: Double) {
                  self.channels = channels
                  self.sampleRate = sampleRate
              }
          """
              s = s[:end] + init + s[end:]
              p.write_text(s)
          PY

      - name: Add ignore rules
        shell: bash
        run: |
          cat >> .gitignore <<'EOF'
          .build/
          *.xcarchive
          DerivedData/
          node_modules/
          xcuserdata/
          EOF

      - name: Commit extracted source and minimal fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VekturDrum .gitignore
          git diff --cached --check
          git commit -m "Add native Vektur Drum source and minimal Swift API fixes"
          git push origin HEAD

      - name: Compile and test Swift package
        working-directory: VekturDrum/native
        run: |
          swift --version
          swift build
          swift test
