name: Prepare native Swift package

on:
  push:
    branches: [ "native/prepare-swift-package" ]
    paths:
      - ".github/workflows/prepare-native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract source and apply the two reviewed Swift fixes
        shell: bash
        run: |
          set -euo pipefail
          test -f VekturDrum-0.9.1.zip
          unzip -oq VekturDrum-0.9.1.zip
          test -f VekturDrum/native/Package.swift
          python3 - <<'PY'
          from pathlib import Path
          p = Path("VekturDrum/native/Sources/VekturDrumCore/FactoryKits.swift")
          s = p.read_text()
          old = "public static func load(bundle: Bundle = .module) -> [Kit] {"
          new = """public static func load() -> [Kit] { load(bundle: .module) }

              public static func load(bundle: Bundle) -> [Kit] {"""
          if old not in s:
              raise SystemExit("A1: expected FactoryKits signature not found; refusing to guess")
          p.write_text(s.replace(old, new, 1))

          p = Path("VekturDrum/native/Sources/VekturDrumCore/Persistence.swift")
          s = p.read_text()
          lines = s.splitlines(keepends=True)
          start = next((i for i, line in enumerate(lines)
                        if line.lstrip().startswith("public struct DecodedSample")), None)
          if start is None:
              raise SystemExit("A2: DecodedSample declaration not found")
          end = next((i for i in range(start + 1, len(lines))
                      if lines[i].strip() == "}"), None)
          if end is None:
              raise SystemExit("A2: DecodedSample closing brace not found")
          block = "".join(lines[start:end])
          if "public init(channels:" not in block:
              lines.insert(end, """
              public init(channels: [[Float]], sampleRate: Double) {
                  self.channels = channels
                  self.sampleRate = sampleRate
              }
          """)
              p.write_text("".join(lines))
          PY
          # Re-apply reviewed runtime-safety fixes after extracting the original archive.
          python3 - <<'PY'
          from pathlib import Path

          # AU render scratch pointers must remain valid for any retained render block.
          p = Path("VekturDrum/native/Sources/VekturDrumAudio/VekturDrumAudioUnit.swift")
          s = p.read_text()
          replacements = [
              ("""    // render-thread scratch, allocated in allocateRenderResources
              private var midiScratch: UnsafeMutablePointer<vd_midi_event>?
              private var busScratch: UnsafeMutablePointer<UnsafeMutablePointer<Float>?>?   // [L, R] bus pointer slots for vd_engine_render
              private var inputScratch: AVAudioPCMBuffer?
              private var outputScratch: AVAudioPCMBuffer?
              private static let midiCapacity = 512""",
               """    // Pointer scratch is allocated once for the unit's lifetime. A render block may outlive a
              // resource reallocation, so these addresses must never be freed/replaced while a block can use them.
              private static let midiCapacity = 512
              private let midiScratch = UnsafeMutablePointer<vd_midi_event>.allocate(capacity: midiCapacity)
              private let busScratch = UnsafeMutablePointer<UnsafeMutablePointer<Float>?>.allocate(capacity: 2)
              private var inputScratch: AVAudioPCMBuffer?
              private var outputScratch: AVAudioPCMBuffer?"""),
              ("""        try super.init(componentDescription: componentDescription, options: options)
              let format""",
               """        try super.init(componentDescription: componentDescription, options: options)
              busScratch.initialize(repeating: nil, count: 2)
              let format"""),
              ("""        engine = e
              keeper = AUStateKeeper(engine: e, library: nil)""",
               """        engine = e
              keeper = AUStateKeeper(engine: e, library: nil)"""),
              ("""    deinit { if let e = engine { vd_engine_destroy(e) }; midiScratch?.deallocate(); busScratch?.deallocate() }""",
               """    deinit {
                  if let e = engine { vd_engine_destroy(e) }
                  midiScratch.deallocate()
                  busScratch.deinitialize(count: 2)
                  busScratch.deallocate()
              }"""),
              ("""        midiScratch?.deallocate(); midiScratch = .allocate(capacity: Self.midiCapacity)
              if busScratch == nil { busScratch = .allocate(capacity: 2); busScratch!.initialize(repeating: nil, count: 2) }""",
               """        // midiScratch and busScratch are lifetime allocations; do not replace them here."""),
              ("""        let e = engine!, effect = isEffect, midiCap = Self.midiCapacity
              let midi = midiScratch!, bus = busScratch!, inBuf = inputScratch, outBuf = outputScratch!""",
               """        let e = engine!, effect = isEffect, midiCap = Self.midiCapacity
              let maxFrames = maximumFramesToRender
              let midi = midiScratch, bus = busScratch, inBuf = inputScratch, outBuf = outputScratch!"""),
              ("""        return { actionFlags, timestamp, frameCount, outputBusNumber, outputData, realtimeEventListHead, pullInputBlock in
                  var ctx = vd_render_context()""",
               """        return { actionFlags, timestamp, frameCount, outputBusNumber, outputData, realtimeEventListHead, pullInputBlock in
                  guard frameCount > 0 else { return noErr }
                  guard frameCount <= maxFrames else { return kAudioUnitErr_TooManyFramesToProcess }
                  var ctx = vd_render_context()""")
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit("AU safety patch anchor not found: " + old.splitlines()[0])
          p.write_text(s)

          # Serialize all Swift-side producers into the engine's single-producer command queue.
          p = Path("VekturDrum/native/Sources/VekturDrumAudio/DrumEngine.swift")
          s = p.read_text()
          old = """public final class DrumEngine: DrumEngineControl {
              /// The C engine."""
          new = """public final class DrumEngine: DrumEngineControl {
              // vd_engine_send is a single-producer queue. This lock is never acquired by the render thread.
              private static let commandQueueLock = NSLock()
              private static func enqueue(_ engine: OpaquePointer, _ command: inout vd_command) -> Bool {
                  commandQueueLock.lock()
                  defer { commandQueueLock.unlock() }
                  return vd_engine_send(engine, &_command)
              }

              /// The C engine."""
          if old in s:
              new = new.replace("&_command", "&command")
              s = s.replace(old, new, 1)
          s = s.replace("guard vd_engine_send(rawEngine, &c) else { return false }",
                        "guard Self.enqueue(rawEngine, &c) else { return false }")
          s = s.replace("return vd_engine_send(rawEngine, &c)", "return Self.enqueue(rawEngine, &c)")
          s = s.replace("_ = vd_engine_send(engine, &c)", "_ = enqueue(engine, &c)")
          if "private static func enqueue" not in s or "vd_engine_send(rawEngine, &c)" in s:
              raise SystemExit("DrumEngine command-queue safety patch failed")
          p.write_text(s)

          # Prevent slow sample decoding from an older restore overwriting a newer project.
          p = Path("VekturDrum/native/Sources/VekturDrumAudio/AUStateKeeper.swift")
          s = p.read_text()
          s = s.replace("public enum Reason { case song, preset }", "public enum Reason: Sendable { case song, preset }")
          anchor = "    private let library: SampleLibrary?\n"
          if "private var sampleLoadGeneration: UInt64" not in s:
              if anchor not in s: raise SystemExit("AUStateKeeper generation property anchor missing")
              s = s.replace(anchor, anchor + "    private var sampleLoadGeneration: UInt64 = 0\n", 1)
          old = """        project = r.project; cache = nil
              apply(project, stopTransport: reason == .song)
              lock.unlock()
              loadSamples(for: r.project)"""
          new = """        project = r.project; cache = nil
              apply(project, stopTransport: reason == .song)
              sampleLoadGeneration &+= 1
              let generation = sampleLoadGeneration
              lock.unlock()
              loadSamples(for: r.project, generation: generation)"""
          if old in s: s = s.replace(old, new, 1)
          old = """        cache = nil
              apply(project, stopTransport: false)
              lock.unlock()
              loadSamples(for: project)"""
          new = """        cache = nil
              apply(project, stopTransport: false)
              sampleLoadGeneration &+= 1
              let generation = sampleLoadGeneration
              let restoredProject = project
              lock.unlock()
              loadSamples(for: restoredProject, generation: generation)"""
          if old in s: s = s.replace(old, new, 1)
          old = """    private func loadSamples(for p: DrumProject) {
                  guard let library else { return }
                  let engine = self.engine"""
          new = """    private func loadSamples(for p: DrumProject, generation: UInt64) {
                  guard let library else { return }
                  let engine = self.engine"""
          if old in s: s = s.replace(old, new, 1)
          if "private func loadSamples(for p: DrumProject, generation: UInt64)" not in s:
              raise SystemExit("AUStateKeeper loadSamples signature patch failed")
          s = s.replace("""                guard let ref, let s = try? await library.decoded(ref) else { vd_engine_set_sample(engine, UInt32(t), nil); return }
                      vd_engine_set_sample(engine, UInt32(t), EngineSamples.make(s, slices: sx, values: values, tempo: tempo))""",
          """                guard let ref, let s = try? await library.decoded(ref) else {
                          guard self?.isCurrentSampleLoad(generation) == true else { return }
                          vd_engine_set_sample(engine, UInt32(t), nil)
                          return
                      }
                      guard self?.isCurrentSampleLoad(generation) == true else { return }
                      vd_engine_set_sample(engine, UInt32(t), EngineSamples.make(s, slices: sx, values: values, tempo: tempo))""")
          if "private func isCurrentSampleLoad" not in s:
              s += """
          
              private func isCurrentSampleLoad(_ generation: UInt64) -> Bool {
                  lock.lock()
                  defer { lock.unlock() }
                  return sampleLoadGeneration == generation
              }
          """
          p.write_text(s)
          PY

      - name: Add ignore rules
        shell: bash
        run: |
          cat >> .gitignore <<'EOF'
          .build/
          *.xcarchive
          DerivedData/
          node_modules/
          xcuserdata/
          EOF

      - name: Generate native Xcode project scaffolding
        shell: bash
        run: |
          brew install xcodegen
          mkdir -p VekturDrum/ios/VekturDrumApp VekturDrum/ios/VekturDrumAU
          cat > VekturDrum/ios/VekturDrumApp/VekturDrumApp.swift <<'SWIFT'
          import SwiftUI
          import VekturDrumCore

          @main
          struct VekturDrumApp: App {
              @State private var project = DrumProject()
              var body: some Scene {
                  WindowGroup {
                      DrumHomeView(project: $project)
                  }
              }
          }

          struct DrumHomeView: View {
              @Binding var project: DrumProject
              @State private var playing = false
              var body: some View {
                  NavigationStack {
                      VStack(spacing: 18) {
                          Text("VEKTUR DRUM").font(.largeTitle.bold())
                          Text("Native drum machine • 12 tracks • 8 patterns")
                              .font(.subheadline).foregroundStyle(.secondary)
                          HStack {
                              Text("TEMPO")
                              Spacer()
                              Text("\(Int(project.tempo)) BPM").monospacedDigit()
                          }
                          Slider(value: $project.tempo, in: 40...240, step: 1)
                          HStack {
                              ForEach(0..<8, id: \.self) { p in
                                  Button("\(p + 1)") { project.selectedPattern = p }
                                      .buttonStyle(.borderedProminent)
                                      .tint(project.selectedPattern == p ? .orange : .gray)
                              }
                          }
                          Text("TRACKS: \(project.trackCount)")
                          Button(playing ? "STOP" : "PLAY") { playing.toggle() }
                              .font(.headline).frame(maxWidth: .infinity).padding()
                              .background(.orange, in: RoundedRectangle(cornerRadius: 12))
                              .foregroundStyle(.black)
                      }.padding()
                  }
              }
          }
          SWIFT
          cat > VekturDrum/ios/VekturDrumAU/AUViewController.swift <<'SWIFT'
          import CoreAudioKit
          import AudioToolbox
          import AVFoundation
          import VekturDrumAudio

          public final class AUViewController: AUViewController, AUAudioUnitFactory {
              public override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .systemBackground
                  let label = UILabel()
                  label.text = "VEKTUR DRUM"
                  label.font = .boldSystemFont(ofSize: 24)
                  label.translatesAutoresizingMaskIntoConstraints = false
                  view.addSubview(label)
                  NSLayoutConstraint.activate([
                      label.centerXAnchor.constraint(equalTo: view.centerXAnchor),
                      label.centerYAnchor.constraint(equalTo: view.centerYAnchor)
                  ])
              }

              public func createAudioUnit(with componentDescription: AudioComponentDescription) throws -> AUAudioUnit {
                  try VekturDrumAudioUnit(componentDescription: componentDescription, options: [])
              }
          }
          SWIFT
          cat > VekturDrum/ios/VekturDrumApp/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleDisplayName</key><string>Vektur Drum</string>
          <key>ITSAppUsesNonExemptEncryption</key><false/>
          <key>UIBackgroundModes</key><array><string>audio</string></array>
          </dict></plist>
          PLIST
          cat > VekturDrum/ios/VekturDrumAU/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleDisplayName</key><string>Vektur Drum AU</string>
          <key>NSExtension</key><dict>
          <key>NSExtensionPointIdentifier</key><string>com.apple.AudioUnit-UI</string>
          <key>NSExtensionPrincipalClass</key><string>$(PRODUCT_MODULE_NAME).AUViewController</string>
          <key>NSExtensionAttributes</key><dict>
          <key>AudioComponents</key><array>
          <dict><key>name</key><string>Dream Music Temple: Vektur Drum</string><key>description</key><string>Vektur Drum</string><key>manufacturer</key><string>DMTp</string><key>type</key><string>aumu</string><key>subtype</key><string>vkdr</string><key>version</key><integer>2305</integer><key>sandboxSafe</key><true/><key>tags</key><array><string>Drums</string><string>Synthesizer</string></array></dict>
          <dict><key>name</key><string>Dream Music Temple: Vektur Drum FX</string><key>description</key><string>Vektur Drum effects and Slicer</string><key>manufacturer</key><string>DMTp</string><key>type</key><string>aufx</string><key>subtype</key><string>vkfx</string><key>version</key><integer>2305</integer><key>sandboxSafe</key><true/><key>tags</key><array><string>Effects</string><string>Delay</string><string>Reverb</string></array></dict>
          <dict><key>name</key><string>Dream Music Temple: Vektur Drum FX MIDI</string><key>description</key><string>Vektur Drum effects playable</string><key>manufacturer</key><string>DMTp</string><key>type</key><string>aumf</string><key>subtype</key><string>vkfm</string><key>version</key><integer>2305</integer><key>sandboxSafe</key><true/><key>tags</key><array><string>Effects</string><string>Drums</string></array></dict>
          </array></dict></dict></dict>
          </plist>
          PLIST
          cat > VekturDrum/ios/project.yml <<'YAML'
          name: VekturDrum
          options:
            bundleIdPrefix: com.dreammusictemple
            deploymentTarget:
              iOS: "17.0"
          packages:
            VekturDrumKit:
              path: ../native
          targets:
            Vektur Drum:
              type: application
              platform: iOS
              sources:
                - path: VekturDrumApp
              info:
                path: VekturDrumApp/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.dreammusictemple.vekturdrum
                  PRODUCT_NAME: Vektur Drum
                  SWIFT_VERSION: 5.0
                  TARGETED_DEVICE_FAMILY: "1,2"
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGN_STYLE: Automatic
              dependencies:
                - package: VekturDrumKit
                  product: VekturDrumCore
                - package: VekturDrumKit
                  product: VekturDrumAudio
                - target: Vektur Drum AU
                  embed: true
            Vektur Drum AU:
              type: app-extension
              platform: iOS
              sources:
                - path: VekturDrumAU
              info:
                path: VekturDrumAU/Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.dreammusictemple.vekturdrum.au
                  PRODUCT_NAME: Vektur Drum AU
                  SWIFT_VERSION: 5.0
                  APPLICATION_EXTENSION_API_ONLY: YES
                  SKIP_INSTALL: YES
                  GENERATE_INFOPLIST_FILE: YES
                  CODE_SIGN_STYLE: Automatic
              dependencies:
                - package: VekturDrumKit
                  product: VekturDrumAudio
          YAML
          python3 - <<'PY'
          from pathlib import Path
          p = Path("VekturDrum/ios/VekturDrumAU/AUViewController.swift")
          s = p.read_text()
          s = s.replace("public final class AUViewController: AUViewController, AUAudioUnitFactory {",
                        "public final class VekturDrumAUViewController: CoreAudioKit.AUViewController, AUAudioUnitFactory {")
          if "VekturDrumAUViewController: CoreAudioKit.AUViewController" not in s:
              raise SystemExit("AU view-controller rename failed")
          p.write_text(s)
          p = Path("VekturDrum/ios/VekturDrumAU/Info.plist")
          p.write_text(p.read_text().replace("$(PRODUCT_MODULE_NAME).AUViewController",
                                             "$(PRODUCT_MODULE_NAME).VekturDrumAUViewController"))
          PY
          cd VekturDrum/ios
          xcodegen generate
          xcodebuild -list -project VekturDrum.xcodeproj
          xcodebuild -project VekturDrum.xcodeproj -scheme "Vektur Drum" -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Fix AU extension view-controller class name
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("VekturDrum/ios/VekturDrumAU/AUViewController.swift")
          s = p.read_text()
          s = s.replace("public final class AUViewController: AUViewController, AUAudioUnitFactory {",
                        "public final class VekturDrumAUViewController: CoreAudioKit.AUViewController, AUAudioUnitFactory {")
          if "VekturDrumAUViewController: CoreAudioKit.AUViewController" not in s:
              raise SystemExit("AU view-controller declaration was not updated")
          p.write_text(s)
          p = Path("VekturDrum/ios/VekturDrumAU/Info.plist")
          s = p.read_text().replace("$(PRODUCT_MODULE_NAME).AUViewController",
                                    "$(PRODUCT_MODULE_NAME).VekturDrumAUViewController")
          p.write_text(s)
          PY

      - name: Update parameter-count assertion for 0.9.1 long-decay control
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("VekturDrum/native/Tests/VekturDrumCoreTests/ParameterLayoutTests.swift")
          s = p.read_text()
          old = "XCTAssertEqual(ParameterSpec.track.count, 44)   // 0.9: + Metalise, Resample, transient mode / sens, slice, tune mode, stretch, sampler model"
          new = "XCTAssertEqual(ParameterSpec.track.count, 45)   // 0.9.1 adds the long-decay control at stable address 56"
          if old not in s:
              raise SystemExit("Parameter count assertion anchor not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Apply remaining reviewed Swift model and test fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("VekturDrum/native/Sources/VekturDrumCore/Parameters.swift")
          s = p.read_text()
          old = "    case fmAlgorithm = 64, fmFreq, fmRatio, fmRatio2, fmIndex, fmIndexDecay, fmFeedback, fmFold, fmNoise"
          new = "    case long = 56   // NEW (0.9.1): extended decay toggle\n" + old
          if old not in s:
              raise SystemExit("TrackParameter FM enum anchor not found")
          p.write_text(s.replace(old, new, 1))

          p = Path("VekturDrum/native/Tests/VekturDrumCoreTests/SlicerModStateTests.swift")
          s = p.read_text()
          old = 'for style in ["IDM", "Techno", "Lo-Fi & Downtempo", "80s Electro", "Breakbeat", "Ambient"] { XCTAssertEqual(kits.filter { $0.category == style }.count, 10, style) }'
          new = '''for style in ["IDM", "Techno", "Lo-Fi & Downtempo", "80s Electro", "Breakbeat", "Ambient"] {
                      let expected = style == "Techno" ? 11 : 10 // legacy Warehouse Techno plus 10 generated kits
                      XCTAssertEqual(kits.filter { $0.category == style }.count, expected, style)
                  }'''
          if old not in s:
              raise SystemExit("Factory category test anchor not found")
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Fix multi-digit track filtering in parameter generator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("VekturDrum/tools/gen_native_params.js")
          s = p.read_text()
          old = r"!/^t\d\./.test"
          new = r"!/^t\d+\./.test"
          if old not in s:
              raise SystemExit("Expected single-digit track filter not found")
          p.write_text(s.replace(old, new))
          PY

      - name: Regenerate native parameter tables from source of truth
        run: node VekturDrum/tools/gen_native_params.js

      - name: Commit extracted source and minimal fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VekturDrum .gitignore
                    git commit -m "Add native Vektur Drum source and minimal Swift API fixes"
          git push origin HEAD

      - name: Compile and test Swift package
        working-directory: VekturDrum/native
        run: |
          swift --version
          swift build
          swift test

# Trigger corrected package preparation run.
# Parameter generator fix: tracks 10–12 are not master parameters.
