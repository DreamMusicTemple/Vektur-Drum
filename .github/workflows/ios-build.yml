name: Native iOS build verification

on:
  push:
    branches: ["native/prepare-swift-package"]
    paths:
      - "VekturDrum/native/**"
      - "VekturDrum/ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vektur-drum-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate property lists
        run: |
          plutil -lint VekturDrum/ios/VekturDrumApp/Info.plist
          plutil -lint VekturDrum/ios/VekturDrumAU/Info.plist

      - name: Generate Xcode project
        working-directory: VekturDrum/ios
        run: xcodegen generate --spec project.yml

      - name: Show Xcode schemes
        working-directory: VekturDrum/ios
        run: xcodebuild -list -project VekturDrum.xcodeproj

      - name: Build iOS Simulator app and AUv3 extension
        working-directory: VekturDrum/ios
        run: |
          xcodebuild \
            -project VekturDrum.xcodeproj \
            -scheme "Vektur Drum" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/VekturDrumDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Swift package tests
        run: swift test --package-path VekturDrum/native

      - name: Create unsigned device archive for packaging verification
        working-directory: VekturDrum/ios
        run: |
          xcodebuild \
            -project VekturDrum.xcodeproj \
            -scheme "Vektur Drum" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VekturDrum-Unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive
          APP="$RUNNER_TEMP/VekturDrum-Unsigned.xcarchive/Products/Applications/Vektur Drum.app"
          test -d "$APP"
          test -d "$APP/PlugIns/Vektur Drum AU.appex"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          AU_INFO="$APP/PlugIns/Vektur Drum AU.appex/Info.plist"
          test -f "$AU_INFO"
          plutil -lint "$AU_INFO"
          echo "AU extension Info.plist (processed archive output):"
          plutil -p "$AU_INFO"
          plutil -extract NSExtension.NSExtensionAttributes.AudioComponents xml1 -o - "$AU_INFO"

      - name: Upload simulator build product
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VekturDrum-iOS-Simulator-Build
          path: |
            ${{ runner.temp }}/VekturDrumDerivedData/Build/Products/Debug-iphonesimulator/VekturDrum.app
            ${{ runner.temp }}/VekturDrum-Unsigned.xcarchive
          if-no-files-found: warn
          retention-days: 7
