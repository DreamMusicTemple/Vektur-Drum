name: VekturDrum
options:
  bundleIdPrefix: com.dreammusictemple
  deploymentTarget:
    iOS: "17.0"
packages:
  VekturDrumKit:
    path: ../native
targets:
  Vektur Drum:
    type: application
    platform: iOS
    sources:
      - path: VekturDrumApp
    preBuildScripts:
      - name: Generate App Store Icon
        script: |
          set -euo pipefail
          ICON_DIR="${SRCROOT}/VekturDrumApp/Assets.xcassets/AppIcon.appiconset"
          SOURCE="${SRCROOT}/../web/assets/logo256.png.b64"
          mkdir -p "$ICON_DIR"
          base64 -D -i "$SOURCE" -o "$ICON_DIR/AppIcon-source.png"
          sips -s format jpeg -s formatOptions 100 -z 1024 1024 "$ICON_DIR/AppIcon-source.png" --out "$ICON_DIR/AppIcon-temp.jpg" >/dev/null
          sips -s format png "$ICON_DIR/AppIcon-temp.jpg" --out "$ICON_DIR/AppIcon.png" >/dev/null
          rm "$ICON_DIR/AppIcon-source.png" "$ICON_DIR/AppIcon-temp.jpg"
          cat > "$ICON_DIR/Contents.json" <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON
    info:
      path: VekturDrumApp/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dreammusictemple.vekturdrum
        PRODUCT_NAME: Vektur Drum
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: VekturDrumApp/VekturDrumApp.entitlements
        MARKETING_VERSION: 0.9.1
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: VekturDrumKit
        product: VekturDrumCore
      - package: VekturDrumKit
        product: VekturDrumAudio
      - package: VekturDrumKit
        product: VekturDrumDSP
      - target: Vektur Drum AU
        embed: true
  Vektur Drum AU:
    type: app-extension
    platform: iOS
    sources:
      - path: VekturDrumAU
    info:
      path: VekturDrumAU/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dreammusictemple.vekturdrum.au
        PRODUCT_NAME: Vektur Drum AU
        SWIFT_VERSION: 5.0
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: VekturDrumAU/VekturDrumAU.entitlements
        MARKETING_VERSION: 0.9.1
        CURRENT_PROJECT_VERSION: 1
    dependencies:
      - package: VekturDrumKit
        product: VekturDrumAudio
