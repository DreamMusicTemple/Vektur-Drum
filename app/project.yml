# Vektur Drum — Xcode project, generated with XcodeGen (https://github.com/yonaskolb/XcodeGen):
#   cd app && BUNDLE_ID=com.example.vekturdrum APPLE_TEAM_ID=ABCDE12345 xcodegen
# Two targets: the universal iPhone/iPad app and the AUv3 extension it embeds. Both link the local Swift package in
# ../native (C++ engine, model, audio unit) and share the interface in Shared/.
name: VekturDrum
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "0.9.1"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER}"
    DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  VekturDrumKit:
    path: ../native
targets:
  VekturDrum:
    type: application
    platform: iOS
    sources:
      - path: VekturDrum
      - path: Shared
    dependencies:
      - package: VekturDrumKit
        product: VekturDrumDSP
      - package: VekturDrumKit
        product: VekturDrumCore
      - package: VekturDrumKit
        product: VekturDrumAudio
      - target: VekturDrumAU
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: "Vektur Drum"
        PRODUCT_MODULE_NAME: VekturDrumApp
        PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}"
        INFOPLIST_FILE: VekturDrum/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  VekturDrumAU:
    type: app-extension
    platform: iOS
    sources:
      - path: VekturDrumAU
      - path: Shared
    dependencies:
      - package: VekturDrumKit
        product: VekturDrumDSP
      - package: VekturDrumKit
        product: VekturDrumCore
      - package: VekturDrumKit
        product: VekturDrumAudio
    settings:
      base:
        PRODUCT_NAME: VekturDrumAU
        PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}.au"
        INFOPLIST_FILE: VekturDrumAU/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  VekturDrum:
    build:
      targets:
        VekturDrum: all
        VekturDrumAU: all
    archive:
      config: Release
