   16 factory presets each (web/sound-presets.js, generated by tools/soundpresets.py) and 16 slots of your own each,
   saved with the set (S.synth.user / S.drums.user, plus the name of the last loaded preset in .preset). A synth preset
   is the sound; a drum preset is the kit with its 8 patterns and chain. Presets never change the MIDI channel.
   Export writes a .json file (one preset or all of yours); import fills your empty slots. Same JSON as the iPad app. */
const PRESET_SLOTS = 16;
const PRE = { kind: 'synth', sel: null };   // sel: { src: 'f' | 'u', i }
const PRESET_FMT = { synth: 'vektur-spectra-presets', drums: 'vektur-pulse-presets' };
const PRESET_NAME = { synth: () => SPECTRA_NAME, drums: () => DRUM_NAME };

function presetState(kind) { return kind === 'synth' ? synthState() : drumState(); }
function presetUser(kind) {
  const st = presetState(kind);
  if (!Array.isArray(st.user)) st.user = [];
  while (st.user.length < PRESET_SLOTS) st.user.push(null);
  st.user.length = PRESET_SLOTS;
  return st.user;
}
function presetFactory(kind) { return kind === 'synth' ? SYNTH_FACTORY : DRUM_FACTORY; }

// ---- cleaning (anything read from a file or an old set): only known parameters, in range; patterns in shape
function presetCleanP(kind, p) {
  const out = {}, P = kind === 'synth' ? SPECTRA_PARAMS : DRUM_PARAMS, ID = kind === 'synth' ? SP_ID : DP_ID, skip = kind === 'synth' ? 'midi.ch' : 'dr.ch';
  if (p && typeof p === 'object') for (const k of Object.keys(p)) {
    const q = P[ID[k]]; const v = +p[k];
    if (!q || k === skip || !isFinite(v)) continue;
    out[k] = q[3] === 'cont' ? clamp(v, q[4], q[5]) : Math.round(clamp(v, q[4], q[5]));
  }
  return out;
}
function presetCleanPattern(pt) {
  const e = drumEmptyPattern(); if (!pt || typeof pt !== 'object') return e;
  const b = +pt.bars; e.bars = b >= 4 ? 4 : b >= 2 ? 2 : 1;
  for (let t = 0; t < 6; t++) {
    const src = Array.isArray(pt.tr) ? pt.tr[t] : null; if (!src) continue;
    const tr = e.tr[t];
    tr.len = clamp(Math.round(+src.len || 16), 1, 16); tr.div = clamp(Math.round(src.div != null ? +src.div : DRUM_DEF_DIV), 0, DRUM_DIVS.length - 1);
    for (let k = 0; k < 16; k++) {
      const s = Array.isArray(src.s) ? src.s[k] : null;
      if (!Array.isArray(s)) { tr.s[k] = null; continue; }
      const st = [clamp(+s[0] || .8, 0, 1), clamp(+s[1] || 0, -1, 1), clamp(Math.round(+s[2] || 0), -12, 12), clamp(Math.round(+s[3] || 1), 1, 4)];
      if (s.length > 4) st.push(clamp(+s[4] || 0, 0, 1), clamp(+s[5] || 0, 0, 1), clamp(+s[6] || 0, 0, 1), s[7] == null || !isFinite(+s[7]) ? 1 : clamp(+s[7], 0, 1));   // the step's own effects and chance
      tr.s[k] = st;
    }
  }
  return e;
}
function presetClean(kind, o) {
  if (!o || typeof o !== 'object') return null;
  const pr = { name: String(o.name || 'Preset').trim().slice(0, 60) || 'Preset', p: presetCleanP(kind, o.p) };
  if (o.cat) pr.cat = String(o.cat).slice(0, 30);
  if (kind === 'drums') {
    pr.pats = (Array.isArray(o.pats) ? o.pats : []).slice(0, 8).map(presetCleanPattern);
    if (!pr.pats.length) pr.pats = [drumEmptyPattern()];
    pr.chain = (Array.isArray(o.chain) ? o.chain : []).slice(0, 16).map(c => clamp(Math.round(+c || 0), 0, 7));
    pr.chainOn = !!o.chainOn;
    pr.smp = [0, 1, 2, 3, 4, 5].map(i => Array.isArray(o.smp) && typeof o.smp[i] === 'string' ? o.smp[i].slice(0, 12) : null);   // track samples (keys)
  }
  return pr;
}

// ---- capture / apply
function presetCapture(kind, name) {
  const st = presetState(kind);
  const pr = { name: String(name).trim().slice(0, 60) || 'My preset', p: presetCleanP(kind, st.p) };
  if (kind === 'drums') { pr.pats = JSON.parse(JSON.stringify(st.pats)); pr.chain = st.chain.slice(); pr.chainOn = !!st.chainOn; pr.smp = drumSmp().slice(); }
  return pr;
}
async function presetApply(kind, pr) {
  const st = presetState(kind);
  if (kind === 'synth') {
    const ch = st.p['midi.ch']; st.p = Object.assign({}, pr.p); if (ch != null) st.p['midi.ch'] = ch;
    st.preset = pr.name;
    synthPanic(); synthPushAll();
    if (!st.on) await synthSetOn(true);
    if (typeof synthOpen === 'function' ? synthOpen() : ($('#synthModal') && $('#synthModal').classList.contains('open'))) renderSynth();
  } else {
    const ch = st.p['dr.ch']; st.p = Object.assign({}, pr.p); if (ch != null) st.p['dr.ch'] = ch;
    const pats = (pr.pats || []).slice(0, 8).map(x => JSON.parse(JSON.stringify(x))); while (pats.length < 8) pats.push(drumEmptyPattern());
    st.pats = pats; st.chain = (pr.chain || []).slice(0, 16); st.chainOn = !!pr.chainOn; st.sel = 0; st.preset = pr.name;
    st.smp = [0, 1, 2, 3, 4, 5].map(i => { const k = pr.smp && pr.smp[i]; return k && drumLib().some(f => f.key === k) ? k : null; });   // factory kits: none
    drumSamplesPush();
    if (!st.on) await drumsSetOn(true); else drumPushAll();
    if (drumsOpen()) renderDrums();
  }
  dirty(); toast(pr.name + ' loaded');
  if (presetsOpen()) renderPresets();
}

// ---- files
function presetFile(kind, list) {
  const o = { format: PRESET_FMT[kind], version: 1, presets: list };
  if (kind === 'drums') { const keys = new Set(list.flatMap(p => (p.smp || []).filter(Boolean))); const smp = drumLib().filter(f => keys.has(f.key) && f.data); if (smp.length) o.samples = smp; }   // the kits' sample files travel with them
  return JSON.stringify(o, null, 1);
}
function presetExport(kind, list, base) {
  const ext = kind === 'synth' ? '.spectra.json' : '.pulse.json';
  downloadText(presetFile(kind, list.map(p => presetClean(kind, p))), (base || 'presets').replace(/[^\w-]+/g, '_') + ext, 'application/json');
}
/** Reads a preset file's text: returns the cleaned presets, or an error message. */
function presetParse(kind, text) {
  let o; try { o = JSON.parse(text); } catch (e) { return 'That file is not a preset file.'; }
  const other = kind === 'synth' ? 'drums' : 'synth';
  if (o && o.format === PRESET_FMT[other]) return `That file holds ${PRESET_NAME[other]()} presets — import it in the ${PRESET_NAME[other]()} preset browser.`;
  const list = o && o.format === PRESET_FMT[kind] && Array.isArray(o.presets) ? o.presets : (o && o.p ? [o] : null);
  if (!list) return 'That file is not a ' + PRESET_NAME[kind]() + ' preset file.';
  const out = list.map(x => presetClean(kind, x)).filter(Boolean);
  if (kind === 'drums' && out.length) {   // sample files carried in the file: add them to the set; drop references to ones that aren't there
    const files = (Array.isArray(o.samples) ? o.samples : []).filter(f => f && typeof f.key === 'string' && typeof f.data === 'string');
    out.forEach(pr => { pr.smp = pr.smp.map(k => k && (drumLib().some(f => f.key === k) || files.some(f => f.key === k)) ? k : null); });
    const used = new Set(out.flatMap(pr => pr.smp.filter(Boolean)));
    files.forEach(f => { if (used.has(f.key) && !drumLib().some(x => x.key === f.key)) drumLib().push({ key: f.key, name: String(f.name || 'Sample').slice(0, 40), fmt: f.fmt === 'flac' ? 'flac' : 'wav', data: f.data }); });
  }
  return out.length ? out : 'That file has no presets in it.';
}
/** Puts presets into the empty slots, in order. Returns [added, skipped]. */
function presetAddToSlots(kind, list) {
  const u = presetUser(kind); let added = 0;
  for (const pr of list) { const i = u.indexOf(null); if (i < 0) break; u[i] = pr; added++; }
  return [added, list.length - added];
}
function presetImport(kind) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const r = presetParse(kind, await f.text());
    if (typeof r === 'string') { toast(r); return; }
    const [a, s] = presetAddToSlots(kind, r);
    dirty(); renderPresets();
    toast(a ? `Imported ${a} preset${a > 1 ? 's' : ''}` + (s ? ` · ${s} skipped: no empty slots` : '') : 'No empty slots: delete one of yours first');
  };
  inp.click();
}

// ---- browser
function presetModal() { let m = $('#presetModal'); if (!m) { m = el('div', 'modal'); m.id = 'presetModal'; m.appendChild(el('div', 'sheet presheet')); m.onclick = e => { if (e.target === m) closePresets(); }; document.body.appendChild(m); } return m; }
function presetsOpen() { const m = $('#presetModal'); return !!(m && m.classList.contains('open')); }
function openPresets(kind) { PRE.kind = kind; PRE.sel = null; const m = presetModal(); document.body.appendChild(m); m.classList.add('open'); renderPresets(); }   // above the synth / drum panel
function closePresets() { const m = $('#presetModal'); if (m) m.classList.remove('open'); }
function renderPresets() {
  const kind = PRE.kind, st = presetState(kind), u = presetUser(kind), F = presetFactory(kind);
  const sh = presetModal().querySelector('.sheet'); sh.innerHTML = '';
  const h = el('h2'); h.appendChild(el('span', null, PRESET_NAME[kind]().toUpperCase() + ' PRESETS')); h.appendChild(el('span', 'spacer'));
  const x = el('button', 'cbtn', 'Close'); x.onclick = closePresets; h.appendChild(x); sh.appendChild(h);
  sh.appendChild(el('div', 'precur', 'Current: ' + (st.preset || '—') + (kind === 'drums' ? ' · a drum preset is the kit with its 8 patterns and chain' : '')));
  const tile = (pr, src, i) => {
    const b = el('button', 'pretile' + (pr ? '' : ' empty') + (PRE.sel && PRE.sel.src === src && PRE.sel.i === i ? ' sel' : '') + (pr && st.preset === pr.name ? ' cur' : ''));
    b.appendChild(el('small', null, src === 'f' ? (pr.cat || '') : 'Slot ' + (i + 1)));
    b.appendChild(el('b', null, pr ? pr.name : 'Empty — tap to save'));
    b.onclick = () => {
      PRE.sel = { src, i };
      if (pr) presetApply(kind, pr);
      else presetSaveTo(i);
    };
    return b;
  };
  sh.appendChild(el('h4', null, 'Factory'));
  const fg = el('div', 'pregrid'); F.forEach((pr, i) => fg.appendChild(tile(pr, 'f', i))); sh.appendChild(fg);
  sh.appendChild(el('h4', null, 'Yours — saved with the set'));
  const ug = el('div', 'pregrid'); u.forEach((pr, i) => ug.appendChild(tile(pr, 'u', i))); sh.appendChild(ug);
  // actions on the selected preset
  const sel = PRE.sel, selPr = sel ? (sel.src === 'f' ? F[sel.i] : u[sel.i]) : null;
  const row = el('div', 'row prebtns');
  const btn = (t, f, dis) => { const b = el('button', 'cbtn', t); b.disabled = !!dis; b.onclick = f; row.appendChild(b); return b; };
  const userSel = sel && sel.src === 'u';
  btn(userSel ? `Save current to slot ${sel.i + 1}` : 'Save current…', () => presetSaveTo(userSel ? sel.i : u.indexOf(null)));
  btn('Rename…', () => { const n = prompt('Preset name', selPr.name); if (n == null || !n.trim()) return; u[sel.i] = Object.assign({}, selPr, { name: n.trim().slice(0, 60) }); dirty(); renderPresets(); }, !(userSel && selPr));
  btn('Delete', () => { if (!confirm(`Delete “${selPr.name}” from slot ${sel.i + 1}?`)) return; u[sel.i] = null; if (kind === 'drums') drumSamplesPrune(); dirty(); renderPresets(); }, !(userSel && selPr));
  btn('Export', () => presetExport(kind, [selPr], selPr.name), !selPr);
  btn('Export all yours', () => presetExport(kind, u.filter(Boolean), (S.name || 'set') + '-' + (kind === 'synth' ? 'spectra' : 'pulse')), !u.some(Boolean));
  btn('Import…', () => presetImport(kind));
  sh.appendChild(row);
  sh.appendChild(el('div', 'clhelp', 'Tap a preset to load it. Tap an empty slot to save the current ' + (kind === 'synth' ? 'sound' : 'kit and patterns') + ' there; select one of yours to overwrite, rename, delete or export it. Import adds the presets in a file to your empty slots. Your MIDI channel never changes.'));
}
function presetSaveTo(i) {
  const kind = PRE.kind, u = presetUser(kind), st = presetState(kind);
  if (i < 0) { toast('All 16 slots are full: delete one first'); return; }
  if (u[i] && !confirm(`Replace “${u[i].name}” in slot ${i + 1} with the current ${kind === 'synth' ? 'sound' : 'kit'}?`)) return;
  const n = prompt('Preset name', u[i] ? u[i].name : (st.preset ? st.preset + ' (edit)' : 'My ' + (kind === 'synth' ? 'sound' : 'kit')));
  if (n == null) return;
  u[i] = presetCapture(kind, n); st.preset = u[i].name; PRE.sel = { src: 'u', i };

(function presetCSS() {
  const st = document.createElement('style');
  st.textContent = `#presetModal{z-index:70}
.presheet{width:min(60rem,96vw)}

.pretile small{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6}.pretile b{font-size:.85rem;font-weight:600}
.pretile.empty b{font-weight:400;opacity:.5}.pretile.cur{border-color:var(--accent)}.pretile.sel{box-shadow:0 0 0 2px var(--accent) inset}
.prebtns{display:flex;flex-wrap:wrap;gap:.4rem;margin:.9rem 0 .5rem}
@media (max-width:640px){.pregrid{grid-template-columns:repeat(2,1fr)}}`;
  document.head.appendChild(st);

/* ---- extracted from Vektur VJ: samples ---- */
/* ============================================================ VEKTUR PULSE — samples on tracks
   Touch and hold a track name or a pad (or right-click it, or use SAMPLE… in SOUND) to import a WAV or FLAC file
   for that track. The track then plays the sample in place of its drum model — tune, decay (full = play to the end),
   tone (low-pass), level, pan, crush and sends still apply — and shows the file's name in place of Kick, Snare…
   The files are stored in the set (S.drumSamples = [{ key, name, fmt, data: base64 }]; tracks refer to them in
   S.drums.smp), so an exported set — and the iPad app — opens with them. The browser's autosave keeps the bytes in
   IndexedDB instead of localStorage, like imported fonts. */
const DSMP = { mono: new Map(), sent: '', busy: false, stored: new Set() };   // key → { d: Float32Array, rate } (decoded once)
const DSMP_BYTES = 20000000, DSMP_TYPES = ['wav', 'wave', 'flac'];

function drumLib() { if (!Array.isArray(S.drumSamples)) S.drumSamples = []; return S.drumSamples; }
function drumSmp() { const d = drumState(); if (!Array.isArray(d.smp)) d.smp = [null, null, null, null, null, null]; while (d.smp.length < 6) d.smp.push(null); return d.smp; }
function drumSampleName(t) { const k = drumSmp()[t]; if (!k) return null; const f = drumLib().find(x => x.key === k); return f ? f.name : null; }
function dsmpKey(bytes) { let h = 0x811c9dc5; for (let i = 0; i < bytes.length; i++) { h ^= bytes[i]; h = Math.imul(h, 0x01000193) >>> 0; } return 's' + h.toString(16).padStart(8, '0'); }

/** WAV / FLAC bytes → mono Float32Array at the file's own rate (or the context's), at most 30 s. */
async function dsmpDecode(bytes) {
  const ctx = A.ctx || new (window.AudioContext || window.webkitAudioContext)();
  const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(bytes.slice().buffer, res, rej); if (p && p.catch) p.catch(rej); });
  const n = Math.min(buf.length, Math.floor(buf.sampleRate * 30)), d = new Float32Array(n), ch = buf.numberOfChannels;
  for (let c = 0; c < ch; c++) { const x = buf.getChannelData(c); for (let i = 0; i < n; i++) d[i] += x[i]; }
  if (ch > 1) for (let i = 0; i < n; i++) d[i] /= ch;
  return { d, rate: buf.sampleRate };
}
async function dsmpMono(f) {
  if (DSMP.mono.has(f.key)) return DSMP.mono.get(f.key);
  if (!f.data) return null;
  try { const m = await dsmpDecode(ufontBytes(f.data)); DSMP.mono.set(f.key, m); return m; } catch (e) { return null; }
}
/** Sends the tracks' samples to the engine (all of them with `force`, e.g. after the engine was made again). */
async function drumSamplesPush(force) {
  if (!SYN.node) return;
  const smp = drumSmp(), sig = smp.map(k => k || '-').join(',');
  if (!force && sig === DSMP.sent) return;
  DSMP.sent = sig;
  for (let t = 0; t < 6; t++) {
    const k = smp[t], f = k && drumLib().find(x => x.key === k);
    const m = f ? await dsmpMono(f) : null;
    if (m) { const copy = m.d.slice(); SYN.node.port.postMessage({ dr: ['w', t, copy, m.rate] }, [copy.buffer]); }
    else SYN.node.port.postMessage({ dr: ['w', t, null, 0] });
  }
}
/** Keeps only files a track or one of your saved kits still uses. */
function drumSamplesPrune() {
  const used = new Set(drumSmp().filter(Boolean));
  (drumState().user || []).forEach(pr => (pr && pr.smp || []).forEach(k => { if (k) used.add(k); }));
  S.drumSamples = drumLib().filter(f => used.has(f.key));
  for (const k of [...DSMP.mono.keys()]) if (!used.has(k)) DSMP.mono.delete(k);
}
async function drumImportSample(t, file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (!DSMP_TYPES.includes(ext)) { toast('Choose a WAV or FLAC file'); return; }
  if (file.size > DSMP_BYTES) { toast('That file is larger than 20 MB'); return; }
  audioEnsure();
  const bytes = new Uint8Array(await file.arrayBuffer()), key = dsmpKey(bytes);
  let f = drumLib().find(x => x.key === key);
  if (!f) {
    const name = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim().slice(0, 40) || 'Sample';
    f = { key, name, fmt: ext === 'flac' ? 'flac' : 'wav', data: ufontB64(bytes) };
    try { DSMP.mono.set(key, await dsmpDecode(bytes)); } catch (e) { toast("That file isn't a WAV or FLAC this browser can read"); return; }
    drumLib().push(f);
    try { await filePut('dsmp:' + key, new Blob([bytes]), f.name); DSMP.stored.add(key); } catch (e) { }
  }
  drumSmp()[t] = key; drumState().preset = '';
  drumSamplesPrune(); dirty();
  await drumSamplesPush(); renderDrums();
  toast(`Track ${t + 1} plays ${f.name} — saved inside the set`);
}
function drumRemoveSample(t) { if (!drumSmp()[t]) return; drumSmp()[t] = null; drumSamplesPrune(); dirty(); drumSamplesPush(); renderDrums(); }
function drumPickSample(t) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.wav,.wave,.flac,audio/wav,audio/x-wav,audio/flac,audio/x-flac';
  inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) drumImportSample(t, f); };
  inp.click();
}
/** The small menu by a track name / pad / SAMPLE… button. */
function drumSampleMenu(t, anchor) {
  const old = $('#dsmpMenu'); if (old) old.remove();
  const m = el('div', 'dsmpmenu'); m.id = 'dsmpMenu'; m.setAttribute('role', 'menu');
  m.appendChild(el('b', null, `TRACK ${t + 1}` + (drumSampleName(t) ? ' · ' + drumSampleName(t) : '')));
  const add = (txt, f) => { const b = el('button', null, txt); b.setAttribute('role', 'menuitem'); b.onclick = () => { m.remove(); f(); }; m.appendChild(b); };
  add(drumSampleName(t) ? 'Replace sample (WAV or FLAC)…' : 'Import sample (WAV or FLAC)…', () => drumPickSample(t));
  if (drumSampleName(t)) add('Remove sample — back to ' + DRUM_MODELS[Math.round(drumVal(`t${t + 1}.model`))], () => drumRemoveSample(t));
  add('Cancel', () => { });
  document.body.appendChild(m);
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left)) + 'px';
  m.style.top = (r.bottom + h + 8 < innerHeight ? r.bottom + 4 : Math.max(8, r.top - h - 4)) + 'px';
  setTimeout(() => { const off = e => { if (!m.contains(e.target)) { m.remove(); document.removeEventListener('pointerdown', off, true); } }; document.addEventListener('pointerdown', off, true); }, 0);
}
/** Touch and hold (550 ms, without moving) or right-click → the sample menu. Marks the element so its tap is ignored. */
function drumLongPress(node, t) {
  let timer = null, x = 0, y = 0;
  node.addEventListener('pointerdown', e => { x = e.clientX; y = e.clientY; clearTimeout(timer); timer = setTimeout(() => { node.dataset.lp = '1'; drumSampleMenu(t, node); }, 550); });
  const stop = () => clearTimeout(timer);
  node.addEventListener('pointermove', e => { if (Math.abs(e.clientX - x) + Math.abs(e.clientY - y) > 10) stop(); });
  node.addEventListener('pointerup', stop); node.addEventListener('pointercancel', stop); node.addEventListener('pointerleave', stop);
  node.addEventListener('contextmenu', e => { e.preventDefault(); stop(); drumSampleMenu(t, node); });

/** Restores sample bytes from IndexedDB after an autosave reload (and stores new ones), then sends them. Once a second. */
async function drumSamplesSync() {
  if (DSMP.busy || !S.drums) return;
  DSMP.busy = true;
  try {
    for (const f of drumLib()) {
      if (!f.data) { const r = await fileGet('dsmp:' + f.key); if (r && r.blob) { f.data = ufontB64(new Uint8Array(await r.blob.arrayBuffer())); DSMP.stored.add(f.key); } }
      else if (!DSMP.stored.has(f.key)) { if (!(await fileGet('dsmp:' + f.key))) await filePut('dsmp:' + f.key, new Blob([ufontBytes(f.data)]), f.name); DSMP.stored.add(f.key); }
    }
    await drumSamplesPush();
  } finally { DSMP.busy = false; }
}
setInterval(() => { try { drumSamplesSync(); } catch (e) { } }, 1000);

.dsmpmenu button:hover,.dsmpmenu button:focus-visible{background:#2b2d32}`;
  document.head.appendChild(st);
})();


/* ======================================================================== standalone host (new code: host.js) */
/* Vektur Drum — standalone host for the extracted drum machine (new code, not from Vektur VJ).
   Replaces exactly the Vektur VJ services the drum code calls, and nothing more:
     audio context + worklet (audioEnsure, synthStart, synthMidi, SYN)   · project state + autosave (S, dirty)
     sample byte store (filePut, fileGet → IndexedDB)                     · file download (downloadText)
     tempo (S.bpm + the TEMPO knob)                                       · Web MIDI input → drumsTakeMidi
     the per-frame UI tick (drumsTick)                                    · knob hooks Vektur VJ uses for MIDI learn
   Musical timing never runs here: the sequencer clock is inside the AudioWorklet. This file only paints LEDs. */

const VD_KEY = 'vekturdrum.project.v1';
const S = { bpm: 120, drums: null, drumSamples: [] };
const A = { ctx: null };
const SYN = { node: null, loading: null, dtel: null, dead: false };
const SPECTRA_NAME = 'Vektur Spectra';   // only named in a preset-import error message ("that file holds synth presets")
const macroCatch = () => false;
let VD_FRAMED = false; try { VD_FRAMED = window.self !== window.top; } catch (e) { VD_FRAMED = true; }
if (VD_FRAMED) {   // the hosted preview's sandbox refuses dialogs: save under the suggested name, confirm replacing
  window.prompt = (msg, def) => def != null ? String(def) : '';
  window.confirm = () => true;
}          // Vektur VJ macros / MIDI learn are not part of Vektur Drum (see the report)

// ---- audio
function audioEnsure() {
  if (A.ctx) { if (A.ctx.state !== 'running' && A.ctx.state !== 'closed') A.ctx.resume().catch(() => { }); return; }   // iOS: 'suspended' or 'interrupted'
  // Safari 16.4+: play like a music app — not silenced by the ring/silent switch
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  A.ctx = new AC({ latencyHint: 'interactive' });
}
function drumProcessorSource() {
  return `const DRUM_PARAMS=${JSON.stringify(DRUM_PARAMS)}, DRUM_DIV_BEATS=${JSON.stringify(DRUM_DIV_BEATS)}, DRUM_NOTES=${JSON.stringify(DRUM_NOTES)}, DRUM_DEF_DIV=${DRUM_DEF_DIV};
${drumsMakeEngine.toString()}
${$('#vd-worklet').textContent}`;
}
function hostOnMessage(data) { SYN.dtel = data.dtel; if (data.drec) drumApplyRecorded(data.drec); }
/** AudioWorklet (audio thread). Throws if the browser or the page's security policy doesn't allow it. */
async function startWorklet() {
  if (!A.ctx.audioWorklet || typeof AudioWorkletNode === 'undefined') throw new Error('no AudioWorklet');
  const src = drumProcessorSource();
  const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
  try { await A.ctx.audioWorklet.addModule(url); }
  catch (e) { await A.ctx.audioWorklet.addModule('data:application/javascript;charset=utf-8,' + encodeURIComponent(src)); }
  finally { URL.revokeObjectURL(url); }
  const n = new AudioWorkletNode(A.ctx, 'vektur-drum', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
  n.onprocessorerror = () => { SYN.dead = true; toast('Audio engine stopped'); };
  n.port.onmessage = e => hostOnMessage(e.data);
  SYN.mode = 'worklet';
  return n;
}
/** Fallback: the same processor class on a ScriptProcessorNode (main thread). Timing is still sample-accurate —
    the sequencer counts samples inside the callback — but a busy UI can cause dropouts. Test builds only. */
function startScriptProcessor() {
  sampleRate = A.ctx.sampleRate;
  const proc = new VD_PROCESSOR(), sp = A.ctx.createScriptProcessor(512, 0, 2);
  proc.port.toHost = hostOnMessage;
  sp.onaudioprocess = e => { const ob = e.outputBuffer; proc.process([], [[ob.getChannelData(0), ob.getChannelData(1)]]); };
  SYN.mode = 'script';
  return { port: { postMessage: m => proc.port.onmessage && proc.port.onmessage({ data: m }) }, connect: d => sp.connect(d) };
}
/** Same contract as Vektur VJ's synthStart(): resolves true once the engine node exists. */
async function synthStart() {
  audioEnsure(); if (!A.ctx) { toast('This browser has no Web Audio'); return false; }
  if (SYN.node) return true;
  if (!SYN.loading) SYN.loading = (async () => {
    let n;
    try { n = await startWorklet(); }
    catch (e) { console.warn('AudioWorklet unavailable, using ScriptProcessor fallback:', e); n = startScriptProcessor(); }
    n.connect(A.ctx.destination);
    SYN.node = n; n.port.postMessage({ tempo: S.bpm }); drumPushAll();
  })().catch(err => { SYN.loading = null; console.error(err); toast('The audio engine could not start'); });
  await SYN.loading; return !!SYN.node;
}
function synthMidi(st, d1, d2) { if (SYN.node) SYN.node.port.postMessage({ m: [st, d1, d2] }); }

// ---- tempo (Vektur VJ: the set's clock; here: our own)
function setBpm(v) { S.bpm = Math.round(clamp(+v || 120, 40, 240) * 10) / 10; if (SYN.node) SYN.node.port.postMessage({ tempo: S.bpm }); paintOled(); dirty(); }
function hostTempoKnob(host) {
  slider(host, { knob: true, label: 'Tempo', min: 40, max: 240, def: 120, step: .5, get: () => S.bpm, set: setBpm, fmt: v => v.toFixed(1) });
}

// ---- project: autosave to localStorage; sample bytes in IndexedDB (as in Vektur VJ)
let saveTimer = 0;
function serialize() {
  const lib = (S.drumSamples || []).map(x => ({ key: x.key, name: x.name, fmt: x.fmt }));
  return JSON.stringify({ app: 'vektur-drum', version: 1, bpm: S.bpm, drums: S.drums, drumSamples: lib });
}
function dirty() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(VD_KEY, serialize()); } catch (e) { } }, 400); }
/** Load + validate. Uses the preset cleaner for patterns, so all 8 step fields survive (see report: VJ load bug). */
function loadProject() {
  let o = null; try { o = JSON.parse(localStorage.getItem(VD_KEY) || 'null'); } catch (e) { }
  if (!o || o.app !== 'vektur-drum') return;
  S.bpm = clamp(+o.bpm || 120, 40, 240);
  S.drumSamples = Array.isArray(o.drumSamples) ? o.drumSamples.filter(f => f && typeof f.key === 'string').map(f => ({ key: f.key, name: String(f.name || 'Sample').slice(0, 40), fmt: f.fmt === 'flac' ? 'flac' : 'wav' })) : [];
  const d = o.drums; if (!d || typeof d !== 'object') return;
  const st = drumState();
  st.on = false;   // audio starts on the first tap (browser autoplay rules); PLAY turns the drums on
  st.p = presetCleanP('drums', d.p); if (d.p && d.p['dr.ch'] != null) st.p['dr.ch'] = clamp(Math.round(+d.p['dr.ch']), 0, 16);
  st.pats = [0, 1, 2, 3, 4, 5, 6, 7].map(i => presetCleanPattern(Array.isArray(d.pats) ? d.pats[i] : null));
  st.chain = (Array.isArray(d.chain) ? d.chain : []).slice(0, 16).map(c => clamp(Math.round(+c || 0), 0, 7));
  st.chainOn = !!d.chainOn; st.sel = clamp(Math.round(+d.sel || 0), 0, 7); st.preset = typeof d.preset === 'string' ? d.preset.slice(0, 60) : '';
  st.user = (Array.isArray(d.user) ? d.user : []).slice(0, PRESET_SLOTS).map(x => x ? presetClean('drums', x) : null);
  st.smp = [0, 1, 2, 3, 4, 5].map(i => Array.isArray(d.smp) && typeof d.smp[i] === 'string' && S.drumSamples.some(f => f.key === d.smp[i]) ? d.smp[i] : null);
}
const IDB = { db: null };
function idb() {
  if (IDB.db) return Promise.resolve(IDB.db);
  return new Promise((res, rej) => { const r = indexedDB.open('vekturdrum', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(IDB.db = r.result); r.onerror = () => rej(r.error); });
}
async function filePut(key, blob, name) { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('files', 'readwrite'); t.objectStore('files').put({ blob, name }, key); t.oncomplete = res; t.onerror = () => rej(t.error); }); return key; }
async function fileGet(key) { try { const db = await idb(); return await new Promise(res => { const q = db.transaction('files', 'readonly').objectStore('files').get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } }
function downloadText(text, name, type) {
  if (VD_FRAMED && navigator.clipboard) {   // the hosted preview refuses downloads: hand over the file's text instead
    navigator.clipboard.writeText(text).then(() => toast(name + ' copied — paste it into a .json file'), () => toast('Export is not available in this preview'));
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ---- MIDI in (Vektur VJ routes its MIDI handler through drumsTakeMidi; so do we)
function midiInit() {
  if (!navigator.requestMIDIAccess) return;
  navigator.requestMIDIAccess().then(acc => {
    const hook = () => acc.inputs.forEach(i => { i.onmidimessage = e => { const [st, d1 = 0, d2 = 0] = e.data; drumsTakeMidi(st, d1, d2); }; });
    hook(); acc.onstatechange = hook;
  }).catch(() => { });
}

// ---- iPad / touch: size the panel to the screen (touch targets ≈ 40 pt on iPad), keep gestures for the instrument
function fitScale() {
  const touch = matchMedia('(pointer: coarse)').matches, w = document.documentElement.clientWidth;
  const s = touch && w >= 700 ? Math.min(1.35, Math.max(1, w / 1060)) : 1;
  document.documentElement.style.setProperty('--scale', s.toFixed(3));
}
fitScale(); addEventListener('resize', fitScale); addEventListener('orientationchange', fitScale);
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('visibilitychange', () => { if (!document.hidden && A.ctx) audioEnsure(); });
document.addEventListener('pointerdown', () => { if (A.ctx && A.ctx.state !== 'running') audioEnsure(); }, true);

// ---- boot: the panel is the app
function frame() { try { drumsTick(); } catch (e) { console.error(e); } requestAnimationFrame(frame); }
loadProject(); drumState();
openDrums();
document.addEventListener('pointerdown', () => { audioEnsure(); synthStart(); midiInit(); }, { once: true, capture: true });
requestAnimationFrame(frame);

</script>
