/** Reads a preset file's text: returns the cleaned presets, or an error message. */

  const list = o && o.format === PRESET_FMT[kind] && Array.isArray(o.presets) ? o.presets : (o && o.p ? [o] : null);
  if (!list) return 'That file is not a ' + PRESET_NAME[kind]() + ' preset file.';

/** Vektur Pulse kits and projects → Vektur Drum: the master hat choke becomes choke group A on tracks 3–4 (or none),
    and a track that had a sample plays it through the Sample engine. Keys already present are left alone. */
function drumMigrateParams(p, smp) {
  for (const t of [3, 4]) if (p[`t${t}.choke`] == null) p[`t${t}.choke`] = p['dr.choke'] === 0 ? 0 : 1;
  (smp || []).forEach((k, i) => { if (k && p[`t${i + 1}.engine`] == null) p[`t${i + 1}.engine`] = 1; });
  return p;
}

/* ==== samples.js ==== */
/* ============================================================ VEKTUR PULSE — samples on tracks
   Touch and hold a track name or a pad (or right-click it, or use SAMPLE… in SOUND) to import a WAV or FLAC file
   for that track. The track then plays the sample in place of its drum model — tune, decay (full = play to the end),
   tone (low-pass), level, pan, crush and sends still apply — and shows the file's name in place of Kick, Snare…
   The files are stored in the set (S.drumSamples = [{ key, name, fmt, data: base64 }]; tracks refer to them in
   S.drums.smp), so an exported set — and the iPad app — opens with them. The browser's autosave keeps the bytes in
   IndexedDB instead of localStorage, like imported fonts. */
const DSMP = { mono: new Map(), sent: '', busy: false, stored: new Set() };   // key → { d: Float32Array, rate } (decoded once)
const DSMP_BYTES = 20000000, DSMP_TYPES = ['wav', 'wave', 'flac'];

function drumLib() { if (!Array.isArray(S.drumSamples)) S.drumSamples = []; return S.drumSamples; }
function drumSmp() { const d = drumState(); if (!Array.isArray(d.smp)) d.smp = []; while (d.smp.length < DRUM_TRACKS) d.smp.push(null); return d.smp; }
function drumSampleName(t) { const k = drumSmp()[t]; if (!k) return null; const f = drumLib().find(x => x.key === k); return f ? f.name : null; }
function dsmpKey(bytes) { let h = 0x811c9dc5; for (let i = 0; i < bytes.length; i++) { h ^= bytes[i]; h = Math.imul(h, 0x01000193) >>> 0; } return 's' + h.toString(16).padStart(8, '0'); }

/** WAV / FLAC bytes → mono Float32Array at the file's own rate (or the context's), at most 30 s. */
async function dsmpDecode(bytes) {
  const ctx = A.ctx || new (window.AudioContext || window.webkitAudioContext)();
  const buf = await new Promise((res, rej) => { const p = ctx.decodeAudioData(bytes.slice().buffer, res, rej); if (p && p.catch) p.catch(rej); });
  const n = Math.min(buf.length, Math.floor(buf.sampleRate * 30)), d = new Float32Array(n), ch = buf.numberOfChannels;
  for (let c = 0; c < ch; c++) { const x = buf.getChannelData(c); for (let i = 0; i < n; i++) d[i] += x[i]; }
  if (ch > 1) for (let i = 0; i < n; i++) d[i] /= ch;
  return { d, rate: buf.sampleRate };
}
async function dsmpMono(f) {
  if (DSMP.mono.has(f.key)) return DSMP.mono.get(f.key);
  if (!f.data) return null;
  try { const m = await dsmpDecode(ufontBytes(f.data)); DSMP.mono.set(f.key, m); return m; } catch (e) { return null; }
}
/** Sends the tracks' samples to the engine (all of them with `force`, e.g. after the engine was made again). */
async function drumSamplesPush(force) {
  if (!SYN.node) return;
  const smp = drumSmp(), sig = smp.map(k => k || '-').join(',');
  if (!force && sig === DSMP.sent) return;
  DSMP.sent = sig;
  for (let t = 0; t < DRUM_TRACKS; t++) {
    const k = smp[t], f = k && drumLib().find(x => x.key === k);
    const m = f ? await dsmpMono(f) : null;
    if (m) { const copy = m.d.slice(); SYN.node.port.postMessage({ dr: ['w', t, copy, m.rate] }, [copy.buffer]); }
    else SYN.node.port.postMessage({ dr: ['w', t, null, 0] });
  }
}
/** Keeps only files a track or one of your saved kits still uses. */
function drumSamplesPrune() {
  const used = new Set(drumSmp().filter(Boolean));
  (drumState().user || []).forEach(pr => (pr && pr.smp || []).forEach(k => { if (k) used.add(k); }));
  S.drumSamples = drumLib().filter(f => used.has(f.key));
  for (const k of [...DSMP.mono.keys()]) if (!used.has(k)) DSMP.mono.delete(k);
}
async function drumImportSample(t, file) {
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (!DSMP_TYPES.includes(ext)) { toast('Choose a WAV or FLAC file'); return; }
  if (file.size > DSMP_BYTES) { toast('That file is larger than 20 MB'); return; }
  audioEnsure();
  const bytes = new Uint8Array(await file.arrayBuffer()), key = dsmpKey(bytes);
  let f = drumLib().find(x => x.key === key);
  if (!f) {
    const name = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim().slice(0, 40) || 'Sample';
    f = { key, name, fmt: ext === 'flac' ? 'flac' : 'wav', data: ufontB64(bytes) };
    try { DSMP.mono.set(key, await dsmpDecode(bytes)); } catch (e) { toast("That file isn't a WAV or FLAC this browser can read"); return; }
    drumLib().push(f);
    try { await filePut('dsmp:' + key, new Blob([bytes]), f.name); DSMP.stored.add(key); } catch (e) { }
  }
  drumSmp()[t] = key; drumState().preset = ''; drumSet(`t${t + 1}.engine`, 1, true);   // loading a sample selects the Sample engine
  drumSamplesPrune(); dirty();
  await drumSamplesPush(); renderDrums();
  toast(`Track ${t + 1} plays ${f.name} — saved inside the set`);
}
function drumRemoveSample(t) { if (!drumSmp()[t]) return; drumSmp()[t] = null; drumSet(`t${t + 1}.engine`, 0, true); drumSamplesPrune(); dirty(); drumSamplesPush(); renderDrums(); }
function drumPickSample(t) {

  inp.onchange = () => { const f = inp.files && inp.files[0]; if (f) drumImportSample(t, f); };
  inp.click();

/** Touch and hold (550 ms, without moving) or right-click → the sample menu. Marks the element so its tap is ignored. */

/** Restores sample bytes from IndexedDB after an autosave reload (and stores new ones), then sends them. Once a second. */
async function drumSamplesSync() {
  if (DSMP.busy || !S.drums) return;
  DSMP.busy = true;
  try {
    for (const f of drumLib()) {
      if (!f.data) { const r = await fileGet('dsmp:' + f.key); if (r && r.blob) { f.data = ufontB64(new Uint8Array(await r.blob.arrayBuffer())); DSMP.stored.add(f.key); } }
      else if (!DSMP.stored.has(f.key)) { if (!(await fileGet('dsmp:' + f.key))) await filePut('dsmp:' + f.key, new Blob([ufontBytes(f.data)]), f.name); DSMP.stored.add(f.key); }

/* ============================================================ Vektur Drum — GLITCH panel (new)
   Global glitch on the master bus, after delay and reverb: STUTTER (repeats the slice that just played, re-captured
   every beat), REVERSE (each slice plays the previous one backwards), AKAI METAL (cyclic time-stretch: short grains
   replayed from a slowly advancing source, which rings metallic at the grain rate — the 90s jungle sampler sound).
   Mix, Size and Speed are the targets of three LFOs (free Hz or synced to the beat). */
const GL_SLICE_NAMES = ['1/32', '1/16', '1/8', '1/4', '1/2'];

function renderGlitch(root) {
  const row = el('div', 'dmrow');
  const g = sec('GLITCH', GLITCH_MODES[Math.round(drumVal('gl.mode'))].toUpperCase()); g.classList.add('dmgrow', 'dmgl');
  const mode = Math.round(drumVal('gl.mode'));
  const top = el('div', 'dmglmodes');
  const on = hbtn(drumVal('gl.on') ? 'ON' : 'OFF', 'wide rec' + (drumVal('gl.on') ? ' on' : ''), () => { drumSet('gl.on', drumVal('gl.on') ? 0 : 1); renderDrums(); }, true);
  on.setAttribute('aria-label', 'Glitch on or off'); top.appendChild(on);
  GLITCH_MODES.forEach((n, i) => top.appendChild(hbtn(n.toUpperCase(), 'sm cy' + (mode === i ? ' on' : ''), () => { drumSet('gl.mode', i); renderDrums(); }, true)));
  g.appendChild(top);
  const kn = el('div', 'dmknobs');
  dKnob(kn, 'gl.mix', 'Mix', { fmt: t => Math.round(t * 100) + '%' });
  dKnob(kn, 'gl.size', mode === 2 ? 'Grain' : 'Slice', { fmt: t => mode === 2 ? (3 * Math.pow(20, t)).toFixed(t < .4 ? 1 : 0) + ' ms' : GL_SLICE_NAMES[Math.min(4, Math.floor(t * 5))] });
  dKnob(kn, 'gl.speed', mode === 2 ? 'Stretch' : 'Speed', { fmt: t => mode === 2 ? Math.round((0.25 + 0.75 * t) * 100) + '%' : '×' + Math.pow(2, (t - .5) * 2).toFixed(2) });
  g.appendChild(kn);
  g.appendChild(el('div', 'dmnote', mode === 2
    ? 'Akai metal: grains replay from a source that falls behind and jumps back — the grain length rings as a pitch. Short grains = higher, harsher metal; lower Stretch = slower, more smeared.'
    : mode === 0 ? 'Stutter: repeats the slice that just played; a new slice is caught every beat. Speed changes its pitch.'
      : 'Reverse: every slice plays the previous one backwards. Speed changes its pitch.'));
  row.appendChild(g);
  DRM.els.lfo = [];
  for (let i = 1; i <= 3; i++) {
    const k = `lfo${i}`, s = sec('LFO ' + i, LFO_DESTS[Math.round(drumVal(k + '.dest'))].toUpperCase()); s.classList.add('dmlfo');
    const led = el('i', 'dmlfoled'); s.appendChild(led); DRM.els.lfo.push(led);
    const kk = el('div', 'dmknobs');
    if (drumVal(k + '.sync')) {
      const dd = el('div', 'kcell'); dd.appendChild(el('span', 'klbl', 'Division')); const dsel = el('select'); dsel.setAttribute('aria-label', `LFO ${i} division`);
      LFO_DIVS.forEach((n, j) => { const o = new Option(n, j); if (j === Math.round(drumVal(k + '.div'))) o.selected = true; dsel.appendChild(o); });
      dsel.onchange = () => drumSet(k + '.div', +dsel.value); const ol = el('div', 'oled'); ol.style.cssText = 'min-width:0;padding:.1rem'; ol.appendChild(dsel); dd.appendChild(ol); kk.appendChild(dd);
    } else dKnob(kk, k + '.rate', 'Rate');
    dKnob(kk, k + '.depth', 'Depth');
    s.appendChild(kk);
    const opts = el('div', 'dmlfoopts');
    const pick = (key, list, label) => { const se = el('select'); se.setAttribute('aria-label', `LFO ${i} ${label}`);
      list.forEach((n, j) => { const o = new Option(n, j); if (j === Math.round(drumVal(key))) o.selected = true; se.appendChild(o); });
      se.onchange = () => { drumSet(key, +se.value); renderDrums(); }; const ol = el('div', 'oled'); ol.style.cssText = 'min-width:0;padding:.1rem'; ol.appendChild(se); return ol; };
    opts.append(pick(k + '.shape', LFO_SHAPES, 'shape'), pick(k + '.dest', LFO_DESTS.map(n => '→ ' + n.toUpperCase()), 'destination'));
    const sy = hbtn('SYNC', 'sm cy' + (drumVal(k + '.sync') ? ' on' : ''), () => { drumSet(k + '.sync', drumVal(k + '.sync') ? 0 : 1); renderDrums(); }, true);
    sy.title = 'Sync to the beat (divisions) instead of a free rate in Hz'; opts.appendChild(sy);
    s.appendChild(opts);

  }

}

/* ==== settings.js ==== */
/* ============================================================ Vektur Drum — SETTINGS
   Audio engine (sample rate, latency), power (battery saving, don't sleep, background audio), MIDI (input, learn,
   CC map), the parameter & MIDI CC list, the user manual and About. Preferences are this device's (localStorage),
   not part of the project or kits. */
const APP_VERSION = '0.5 (web test build)';
const PREFS_KEY = 'vekturdrum.prefs.v1';
const LATENCY = [['interactive', 'Low', 'Shortest buffer: tightest pads and MIDI. Uses the most power; may crackle on a busy device.'],

  ['playback', 'Stable', 'Longest buffer: the most robust and battery-friendly; pads and MIDI respond later.']];

/* Factory MIDI CC map (any channel). MIDI Learn replaces or adds to it; "Reset CC map" restores it. */
function ccFactory() {
  const m = {}, put = (cc, key) => { m['drums:' + key] = { cc, ch: 0 }; };
  for (let t = 1; t <= 9; t++) { put(19 + t, `t${t}.level`); put(29 + t, `t${t}.tune`); put(39 + t, `t${t}.decay`); put(101 + t, `t${t}.pan`); }
  put(7, 'dr.level'); put(9, 'dr.swing'); put(12, 'dr.warmth'); put(13, 'dr.dlyfb'); put(14, 'dr.revsize'); put(15, 'dr.dlytone');
  put(50, 'gl.on'); put(51, 'gl.mix'); put(52, 'gl.size'); put(53, 'gl.speed'); put(54, 'gl.mode');
  put(55, 'lfo1.depth'); put(56, 'lfo2.depth'); put(57, 'lfo3.depth'); put(58, 'lfo1.rate'); put(59, 'lfo2.rate'); put(60, 'lfo3.rate');
  return m;
}

  const d = { sampleRate: 0, latency: 'interactive', battery: false, noSleep: false, background: false, midiIn: true, ccMap: ccFactory() };
  try { const o = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null'); if (o && typeof o === 'object') Object.assign(d, o); } catch (e) { }
  if (!LATENCY.some(l => l[0] === d.latency)) d.latency = 'interactive';
  if (!RATES.some(r => r[0] === d.sampleRate)) d.sampleRate = 0;
  if (!d.ccMap || typeof d.ccMap !== 'object') d.ccMap = ccFactory();

})();

/** Battery saving: LEDs at a quarter of the frame rate; audio sleeps after 20 s stopped and silent (wakes on a tap or a note). */

      SET.learnKey = null; learnPath = null; if (settingsOpen()) renderSettings(); SET.ccDirty = true; return;
    }
    const hits = ccIndex()[d1]; if (!hits) return;
    for (const [path, mch] of hits) if (!mch || mch === ch) { drumSetNorm(path.slice(6), d2 / 127); SET.ccDirty = true; }
    return;
  }
  if (type === 0x90 && d2 > 0) { audioWake(); if (A.ctx && A.ctx.state !== 'running') audioEnsure(); }
  drumsTakeMidi(st, d1, d2);
}

<p><b>Chain:</b> select a pattern and tap <b>+ n</b> to add it to the chain (up to 16), <b>⌫</b> removes the last; <b>CHAIN</b> switches between playing the chain and looping one pattern.</p>

  ['Tracks and engines', `<p>Select a track (its name or pad); the SOUND section shows it. Choose its engine: <b>SYNTH</b>, <b>SAMPLE</b> or <b>FM</b>.</p>

<li><b>SAMPLE</b> — touch and hold a track name or pad (or LOAD SAMPLE…) to load a WAV or FLAC (up to 30 s). Tune, Decay (full = play to the end), Tone (low-pass), Sweep, Bits, Rate and the sends shape it. Samples are saved with the project.</li>

/* Vektur Drum — web host: audio, clock, project save, MIDI in, iPad behaviour.
   Replaces exactly the Vektur VJ services the drum code calls, and nothing more:
     audio context + worklet (audioEnsure, synthStart, synthMidi, SYN)   · project state + autosave (S, dirty)
     sample byte store (filePut, fileGet → IndexedDB)                     · file download (downloadText)
     tempo (S.bpm + the TEMPO knob)                                       · Web MIDI input → drumsTakeMidi
     the per-frame UI tick (drumsTick)                                    · knob hooks Vektur VJ uses for MIDI learn
   Musical timing never runs here: the sequencer clock is inside the AudioWorklet. This file only paints LEDs. */

const VD_KEY = 'vekturdrum.project.v1';
const S = { bpm: 120, drums: null, drumSamples: [] };
const A = { ctx: null };
const SYN = { node: null, loading: null, dtel: null, dead: false };
const SPECTRA_NAME = 'Vektur Spectra';   // only named in a preset-import error message ("that file holds synth presets")
const macroCatch = () => false;
let VD_FRAMED = false; try { VD_FRAMED = window.self !== window.top; } catch (e) { VD_FRAMED = true; }
if (VD_FRAMED) {   // the hosted preview's sandbox refuses dialogs: save under the suggested name, confirm replacing
  window.prompt = (msg, def) => def != null ? String(def) : '';
  window.confirm = () => true;
}          // Vektur VJ macros / MIDI learn are not part of Vektur Drum (see the report)

// ---- audio
function audioEnsure() {
  if (A.ctx) { if (A.ctx.state !== 'running' && A.ctx.state !== 'closed') A.ctx.resume().catch(() => { }); return; }   // iOS: 'suspended' or 'interrupted'
  // Safari 16.4+: play like a music app — not silenced by the ring/silent switch
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try { A.ctx = new AC(audioContextOptions()); }   // Settings → sample rate and latency
  catch (e) { A.ctx = new AC({ latencyHint: PREFS.latency }); toast('That sample rate is not available here: using the device rate'); }
}
function drumProcessorSource() {
  return `const DRUM_PARAMS=${JSON.stringify(DRUM_PARAMS)}, DRUM_DIV_BEATS=${JSON.stringify(DRUM_DIV_BEATS)}, DRUM_NOTES=${JSON.stringify(DRUM_NOTES)}, DRUM_DEF_DIV=${DRUM_DEF_DIV};
${drumsMakeEngine.toString()}
${$('#vd-worklet').textContent}`;
}
function hostOnMessage(data) { SYN.dtel = data.dtel; if (data.drec) drumApplyRecorded(data.drec); }
/** AudioWorklet (audio thread). Throws if the browser or the page's security policy doesn't allow it. */
async function startWorklet() {
  if (!A.ctx.audioWorklet || typeof AudioWorkletNode === 'undefined') throw new Error('no AudioWorklet');
  const src = drumProcessorSource();
  const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
  try { await A.ctx.audioWorklet.addModule(url); }
  catch (e) { await A.ctx.audioWorklet.addModule('data:application/javascript;charset=utf-8,' + encodeURIComponent(src)); }
  finally { URL.revokeObjectURL(url); }
  const n = new AudioWorkletNode(A.ctx, 'vektur-drum', { numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2] });
  n.onprocessorerror = () => { SYN.dead = true; toast('Audio engine stopped'); };
  n.port.onmessage = e => hostOnMessage(e.data);
  SYN.mode = 'worklet';
  return n;
}
/** Fallback: the same processor class on a ScriptProcessorNode (main thread). Timing is still sample-accurate —
    the sequencer counts samples inside the callback — but a busy UI can cause dropouts. Test builds only. */
function startScriptProcessor() {
  sampleRate = A.ctx.sampleRate;
  const proc = new VD_PROCESSOR(), sp = A.ctx.createScriptProcessor(512, 0, 2);
  proc.port.toHost = hostOnMessage;
  sp.onaudioprocess = e => { const ob = e.outputBuffer; proc.process([], [[ob.getChannelData(0), ob.getChannelData(1)]]); };
  SYN.mode = 'script';
  return { port: { postMessage: m => proc.port.onmessage && proc.port.onmessage({ data: m }) }, connect: d => sp.connect(d) };
}
/** Same contract as Vektur VJ's synthStart(): resolves true once the engine node exists. */
async function synthStart() {
  audioEnsure(); if (!A.ctx) { toast('This browser has no Web Audio'); return false; }
  if (SYN.node) return true;
  if (!SYN.loading) SYN.loading = (async () => {
    let n;
    try { n = await startWorklet(); }
    catch (e) { console.warn('AudioWorklet unavailable, using ScriptProcessor fallback:', e); n = startScriptProcessor(); }
    n.connect(A.ctx.destination);
    SYN.node = n; n.port.postMessage({ tempo: S.bpm }); drumPushAll();
  })().catch(err => { SYN.loading = null; console.error(err); toast('The audio engine could not start'); });
  await SYN.loading; return !!SYN.node;
}
function synthMidi(st, d1, d2) { if (SYN.node) SYN.node.port.postMessage({ m: [st, d1, d2] }); }

// ---- tempo (Vektur VJ: the set's clock; here: our own)
function setBpm(v) { S.bpm = Math.round(clamp(+v || 120, 40, 240) * 10) / 10; if (SYN.node) SYN.node.port.postMessage({ tempo: S.bpm }); paintOled(); dirty(); }
function hostTempoKnob(host) {
  slider(host, { knob: true, label: 'Tempo', min: 40, max: 240, def: 120, step: .5, get: () => S.bpm, set: setBpm, fmt: v => v.toFixed(1) });
}

// ---- project: autosave to localStorage; sample bytes in IndexedDB (as in Vektur VJ)
let saveTimer = 0;
function serialize() {
  const lib = (S.drumSamples || []).map(x => ({ key: x.key, name: x.name, fmt: x.fmt }));
  return JSON.stringify({ app: 'vektur-drum', version: 1, bpm: S.bpm, drums: S.drums, drumSamples: lib });
}
function dirty() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(VD_KEY, serialize()); } catch (e) { } }, 400); }
/** Load + validate. Uses the preset cleaner for patterns, so all 8 step fields survive (see report: VJ load bug). */
function loadProject() {
  let o = null; try { o = JSON.parse(localStorage.getItem(VD_KEY) || 'null'); } catch (e) { }
  if (!o || o.app !== 'vektur-drum') return;
  S.bpm = clamp(+o.bpm || 120, 40, 240);
  S.drumSamples = Array.isArray(o.drumSamples) ? o.drumSamples.filter(f => f && typeof f.key === 'string').map(f => ({ key: f.key, name: String(f.name || 'Sample').slice(0, 40), fmt: f.fmt === 'flac' ? 'flac' : 'wav' })) : [];
  const d = o.drums; if (!d || typeof d !== 'object') return;
  const st = drumState();
  st.on = false;   // audio starts on the first tap (browser autoplay rules); PLAY turns the drums on
  st.p = drumMigrateParams(presetCleanP('drums', d.p), d.smp); if (d.p && d.p['dr.ch'] != null) st.p['dr.ch'] = clamp(Math.round(+d.p['dr.ch']), 0, 16);
  st.ntr = clamp(Math.round(+d.ntr || DRUM_TRACKS), 6, DRUM_TRACKS);
  st.pats = [0, 1, 2, 3, 4, 5, 6, 7].map(i => presetCleanPattern(Array.isArray(d.pats) ? d.pats[i] : null));
  st.chain = (Array.isArray(d.chain) ? d.chain : []).slice(0, 16).map(c => clamp(Math.round(+c || 0), 0, 7));
  st.chainOn = !!d.chainOn; st.sel = clamp(Math.round(+d.sel || 0), 0, 7); st.preset = typeof d.preset === 'string' ? d.preset.slice(0, 60) : '';
  st.user = (Array.isArray(d.user) ? d.user : []).slice(0, PRESET_SLOTS).map(x => x ? presetClean('drums', x) : null);
  st.smp = Array.from({ length: DRUM_TRACKS }, (_, i) => Array.isArray(d.smp) && typeof d.smp[i] === 'string' && S.drumSamples.some(f => f.key === d.smp[i]) ? d.smp[i] : null);
}
const IDB = { db: null };
function idb() {
  if (IDB.db) return Promise.resolve(IDB.db);
  return new Promise((res, rej) => { const r = indexedDB.open('vekturdrum', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(IDB.db = r.result); r.onerror = () => rej(r.error); });
}
async function filePut(key, blob, name) { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('files', 'readwrite'); t.objectStore('files').put({ blob, name }, key); t.oncomplete = res; t.onerror = () => rej(t.error); }); return key; }
async function fileGet(key) { try { const db = await idb(); return await new Promise(res => { const q = db.transaction('files', 'readonly').objectStore('files').get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } }
function downloadText(text, name, type) {
  if (VD_FRAMED && navigator.clipboard) {   // the hosted preview refuses downloads: hand over the file's text instead
    navigator.clipboard.writeText(text).then(() => toast(name + ' copied — paste it into a .json file'), () => toast('Export is not available in this preview'));
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ---- MIDI in (Vektur VJ routes its MIDI handler through drumsTakeMidi; so do we)
let midiAccess = null;
function midiInit() {
  if (!PREFS.midiIn || !navigator.requestMIDIAccess || midiAccess) return;
  navigator.requestMIDIAccess().then(acc => {
    midiAccess = acc;
    const hook = () => { acc.inputs.forEach(i => { i.onmidimessage = e => { const [st, d1 = 0, d2 = 0] = e.data; vdMidi(st, d1, d2); }; }); midiPortsUpdate(acc); };
    hook(); acc.onstatechange = hook;
  }).catch(() => { });
}

// ---- iPad / touch: size the panel to the screen (touch targets ≈ 40 pt on iPad), keep gestures for the instrument
function fitScale() {
  const touch = matchMedia('(pointer: coarse)').matches, w = document.documentElement.clientWidth;
  const s = touch && w >= 700 ? Math.min(1.35, Math.max(1, w / 1060)) : 1;
  document.documentElement.style.setProperty('--scale', s.toFixed(3));
}
fitScale(); addEventListener('resize', fitScale); addEventListener('orientationchange', fitScale);
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('pointerdown', () => { if (A.ctx && A.ctx.state !== 'running') audioEnsure(); }, true);

// ---- boot: the panel is the app
let frameN = 0;
function frame(now) {
  try {
    if (!PREFS.battery || (++frameN & 3) === 0) drumsTick();   // battery saving: lights at a quarter of the frame rate
    if (SET.ccDirty) { SET.ccDirty = false; if (drumsOpen()) renderDrums(); }   // knobs moved by MIDI CC
    batteryTick(now || performance.now());
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
loadProject(); drumState();
openDrums();
document.addEventListener('pointerdown', () => { audioEnsure(); synthStart(); midiInit(); }, { once: true, capture: true });
wakeLockApply(); mediaSessionApply();
requestAnimationFrame(frame);


</script>
