/* ==== engine.js ==== */
/* ============================================================ VEKTUR DRUM — drum engine + step sequencer (web build)
   Started as Vektur VJ's Vektur Pulse engine (a port of native/Shared/DSP/Drums.h); with every new feature off it
   still renders Vektur Pulse sample for sample (tests/parity.test.js). New in Vektur Drum:
   · 9 tracks (kT from the note table), of which the project plays 6–9   · per-track engine: drum synth, sample or FM
   · per-track pitch sweep · choke groups A–D (replace the fixed closed→open hat choke)
   · FM voice: 3 operators, 4 algorithms, feedback, index envelope, wavefolder, noise; per-step modulator ratio
   · global glitch (stutter, reverse, Akai-style metallic time-stretch) with 3 LFOs
   · modulation: 5 sources (LFO 1–3, envelope follower, chaos) → up to 32 wires to any dial
   · per-step ring modulation (a master track or oscillator × chosen slave tracks, for the step's length)
   · Slicer: beat-synced rearranging of the whole output (repeat, stutter, reverse, tape stop/start, pitch,
     speed, gate, permute, scratch, echo), with density, evolve, seed and momentary hold
   · per-step wavefolder · 4-band EQ per track (low shelf, 2 peaks, high shelf; every gain and frequency modulatable)
   · global tape wow, flutter and vinyl dust (after the Slicer)
   · Rate at its top is "off" at any sample rate (Pulse held 96 kHz to 48 kHz) */
function drumsMakeEngine(PARAMS, DIVB, NOTES, DEF_DIV) {
  const N = PARAMS.length, kT = NOTES.length, kS = 16, kP = 8, kC = 16, kCR = 16, kPi = Math.PI, ND = DIVB.length;
  const PMIN = new Float32Array(N), PMAX = new Float32Array(N), PDEF = new Float32Array(N), PSM = new Uint8Array(N), ID = {};
  PARAMS.forEach((p, i) => { ID[p[0]] = i; PMIN[i] = p[4]; PMAX[i] = p[5]; PDEF[i] = p[6]; PSM[i] = p[3] === 'cont' ? 1 : 0; });
  const T1 = ID['t1.model'], TSTRIDE = ID['t2.model'] - ID['t1.model'];
  const CH = ID['dr.ch'], SWING = ID['dr.swing'], TEMPER = ID['dr.temper'], HUMAN = ID['dr.human'], LEVEL = ID['dr.level'], CHOKE = ID['dr.choke'],
    DLYDIV = ID['dr.dlydiv'], DLYFB = ID['dr.dlyfb'], DLYTONE = ID['dr.dlytone'], DLYPP = ID['dr.dlypp'], REVSIZE = ID['dr.revsize'], REVDAMP = ID['dr.revdamp'];

/* ============================================================ PRESETS — Vektur Spectra sounds and Vektur Pulse kits
   16 factory presets each (web/sound-presets.js, generated by tools/soundpresets.py) and 16 slots of your own each,
   saved with the set (S.synth.user / S.drums.user, plus the name of the last loaded preset in .preset). A synth preset
   is the sound; a drum preset is the kit with its 8 patterns and chain. Presets never change the MIDI channel.
   Export writes a .json file (one preset or all of yours); import fills your empty slots. Same JSON as the iPad app. */
const PRESET_SLOTS = 16;
const PRE = { kind: 'synth', sel: null, bank: 0, cat: 'All' };   // sel: { src: 'f' | 'u', i } · bank: 0 = the set's 16 slots, 1–20 = NEW user banks

async function dsmpDecode(bytes) {

/* ==== manual.js ==== */
/* ============================================================ Vektur Drum — USER MANUAL (single source)
   Shown in SETTINGS → MANUAL. tools/gen_manual.js turns this same file into the native app's manual
   (native/Sources/VekturDrumCore/Manual+Generated.swift) and docs/MANUAL.md, so web and native never drift apart.
   Only <p> <ul> <li> <b> <i> <a> are used. */
const MANUAL = [
  ['Welcome', `<p>Vektur Drum is a nine-track drum machine. Every track can be a <b>drum synth</b> (eight analogue-style models), a <b>sample</b> you load, or a dedicated <b>FM percussion</b> voice. A step sequencer with eight patterns, per-step <b>ring modulation</b> and <b>fold</b>, a <b>4-band EQ</b> on every track, per-step <b>pitch shift</b> and <b>spectral</b> effects, <b>Metalise</b> (in the Slicer window), the <b>Slicer</b>, delay, four <b>reverbs</b> (Room, Spring, Gate, Expanse), <b>tape &amp; vinyl</b>, <b>TEMPER</b> and <b>HUMANISE</b> complete it — the App Store app also runs as an <b>AUv3 effect</b> on any track — and a <b>modulation matrix</b> lets three LFOs, an envelope follower and a chaos generator move any dial, with a light on each dial showing where it is.</p>
<p><b>First sound:</b> tap anywhere to start the audio, then press <b>PLAY</b>. Pattern 1 has a starter groove. Load a kit from <b>PRESETS</b> to hear what it can do — there are 88, among them 10 each of IDM, Techno, Lo-Fi &amp; Downtempo, Hard Trance &amp; Psytrance, 80s Electro, Breakbeat and Ambient — or start from <b>INIT</b>, a blank kit — then open <b>SLICER</b>, tap JUNGLE and turn it ON.</p>`],
  ['The panel at a glance', `<ul><li><b>Top strip</b> — TRACKS 6–9 (how many tracks this project uses), ON (power), PRESETS, <b>SLICER</b> (its own window), <b>MOD</b> (the modulation window), SETTINGS.</li>
<li><b>Transport</b> — PLAY (starts on the next beat), STOP, REC (records pad hits and MIDI notes into the pattern while playing).</li>
<li><b>Display</b> — pattern, loop or chain position, tempo, current step, selected track.</li>
<li><b>Pattern</b> — patterns 1–8; COPY, PASTE, CLEAR for the selected pattern; then <b>BARS</b> (1, 2 or 4) and the <b>CHAIN</b> on one row.</li>
<li><b>Master</b> — Tempo, Swing, <b>TEMPER</b> (warm ↔ cold), <b>HUMANISE</b>, Level.</li>
<li><b>Sequencer</b> — one row per track: name, M (mute), S (solo), 16 steps, length and timing division.</li>
<li>Below the sequencer, four columns: <b>Performance</b> (nine pads; <b>⤢</b> opens them in their own window); <b>Sound</b> — the selected track; <b>Step</b> (the selected step, and its RING MOD) over the track's <b>EQ</b>; <b>Effects</b> (delay, reverb, MIDI channel) over <b>Tape</b>. Every section has a clear title with a coloured bar; the effects sit in a dark grey area of their own; every other kind of section has its own shade of grey.</li>
<li><b>LFO 1–3</b> along the bottom. The small coloured chip on each LFO is a modulation source you can drag onto any dial.</li></ul>
<p>The signal runs: tracks (EQ, then ring modulation) → delay and reverb → <b>Metalise</b> → <b>Slicer</b> → <b>tape &amp; vinyl</b> → <b>TEMPER</b> → level. (Each step's pitch shift and spectral effect work inside its track, before the EQ.) On narrow screens the columns stack.</p>`],
  ['Playing and patterns', `<p><b>Pads:</b> higher on a pad plays harder. Tapping a pad also selects its track. <b>⤢</b> (top right of PERFORMANCE) opens the pads in a window of their own: drag its title bar to move it, its corner to resize it, <b>⛶</b> to fill the screen. The pads grow with the window and play several at once; the window remembers where it was.</p>
<p><b>Patterns:</b> tap 1–8 to select. While playing, the new pattern starts when the current one ends. <b>BARS</b> sets the pattern's length; each track repeats its own steps inside it.</p>
<p><b>Chain</b> (on the BARS row): the chain is a strip of coloured chips, one colour per pattern. <b>+ n</b> adds the selected pattern at the end, or <b>drag a pattern button</b> (1–8) onto the strip to insert it exactly where you drop it. <b>Drag a chip</b> sideways to move it, tap its <b>×</b> to remove it, tap the chip to edit that pattern; CLEAR empties the chain. Up to 16 positions. <b>CHAIN</b> switches between playing the chain and looping one pattern; while it plays, the chip playing now lights up.</p>
<p><b>Recording:</b> light <b>REC</b>, press PLAY, and play pads or MIDI notes: each hit is written to the nearest step.</p>`],
  ['Programming steps', `<p>Tap a step to switch it on or off. <b>Hold</b> a step (or turn <b>EDIT</b> on and tap) to edit it in the STEP section:</p>
<ul><li><b>Velocity, Pan, Pitch</b> (±12 semitones), <b>Ratchet</b> ×1–×4 (repeats inside the step).</li>
<li><b>Crush</b> (bit depth), <b>Delay</b> and <b>Reverb</b> sends (added to the track's), <b>Fold</b> (this step's own wavefolder: from a little warmth to a buzzing, metallic edge — any engine), <b>Chance</b> (probability of playing each time round).</li>
<li><b>FM ratio</b> (FM tracks only): this step's own modulator ratio — melodic and metallic variations from one sound. TRACK = use the track's Ratio.</li>
<li><b>RING MOD…</b> — opens the ring modulator for this step (see <i>Ring modulation</i>).</li>
<li><b>PITCH SHIFT</b> — <i>Shift</i> (±24 semitones) and <i>Mix</i>: a pitch-shifted copy of this step's sound, any engine (synth, sample, FM). Mix 100 % is the shifted sound alone; lower mixes it with the original — +12 or +7 at 30 % is a shimmer.</li>
<li><b>SPECTRAL</b> — <i>Spectral</i> (amount), <i>Colour</i> and <i>Mix</i>. Colour is six manipulations in one dial, and where it sits inside each sets that manipulation's own setting: <b>SMEAR</b> (blurs the spectrum over time), <b>SHIFT</b> (moves every partial up — metallic, inharmonic), <b>HARMONIC</b> (keeps only a harmonic comb), <b>ROBOT</b> (flattens the phases into a buzzing monotone), <b>WHISPER</b> (keeps the spectrum, randomises the phases — breath and noise), <b>FREEZE</b> (holds the spectrum and lets it decay slowly). The display under the dial names the zone and its setting. Spectral then sets how far it goes.</li></ul>
<p>Small marks on a step show its ratchet, pitch, chance and FM ratio; a cyan dot means it has its own effects; an amber ring means it ring-modulates.</p>
<p><b>Length & DIV</b> (right of each row): each track can have 1–16 steps and its own timing (1/4 to 1/32, triplets, dotted) — for polyrhythms and shifting loops. <b>Swing</b> delays every second step.</p>`],
  ['Ring modulation', `<p>Every step can ring-modulate other tracks. Select a step and tap <b>RING MOD…</b>:</p>
<ul><li><b>RING ON</b> — when this step plays, the ring is active for the length of the step.</li>
<li><b>Master</b> — the modulator: one of the tracks (T1–T9) or <b>OSC</b>, a pure sine oscillator. A master track is level-normalised, so even a quiet hat modulates fully; the master itself is not changed.</li>
<li><b>Slaves</b> — the tracks that get multiplied by the master. ALL and NONE set them quickly.</li>
<li><b>Amount</b> — from dry to fully ringed. <b>Osc</b> (with OSC master) — 20 Hz–5 kHz: low is tremolo, high is the classic clangy ring-mod.</li>
<li><b>COPY TO TRACK</b> — the same ring settings on every active step of this track.</li></ul>
<p>Try: master T1 (kick) with slaves the hats — the hats take on the kick's body and pitch; or OSC at 700–1500 Hz on a snare for metallic jungle snares. Ring steps on different steps make the effect move through the bar.</p>`],
  ['Tracks and engines', `<p>Select a track (its name or pad); the SOUND section shows it. Choose its engine: <b>SYNTH</b>, <b>SAMPLE</b> or <b>FM</b>.</p>
<ul><li><b>SYNTH</b> — Kick, Snare, Closed hat, Open hat, Clap, Tom, Rim, Bell. <i>Tone</i> and <i>Snap</i> shape each model (snap is the click / noise).</li>
<li><b>SAMPLE</b> — touch and hold a track name or pad (or LOAD SAMPLE…) to load a WAV or FLAC (up to 30 s). Tune, Decay (full = play to the end), Tone (low-pass), Sweep, Bits, Rate and the sends shape it. Samples are saved with the project.</li>
<li><b>FM</b> — see below.</li></ul>
<p>Every engine has: <b>Tune</b>, <b>Decay</b>, <b>Level</b>, <b>Pan</b>, <b>Bits</b> and <b>Rate</b> (lo-fi), <b>Delay/Reverb</b> sends, <b>Sweep</b> and <b>Bend</b>.</p>
<p><b>Pitch sweep:</b> each hit starts <i>Sweep</i> semitones away (up to ±48) and glides home over <i>Sw time</i> — punchy kicks, zappy toms, laser percussion. <b>Bend</b> is a fixed offset, or a wobble at <i>Bend rate</i>.</p>
<p><b>Choke groups A–D:</b> tracks in the same group cut each other off — put a closed and an open hat in the same group. Tracks 3 and 4 start in group A.</p>
<p><b>EQ:</b> every track has a 4-band EQ (in the EQ section, for the selected track): <b>LO</b> shelf 20–500 Hz, <b>LO-MID</b> and <b>HI-MID</b> peaks (80 Hz–5 kHz, 400 Hz–12 kHz), <b>HI</b> shelf 1.5–18 kHz, each ±18 dB. A band at 0 dB is off; the curve shows the result, FLAT resets it. Every frequency and gain is a modulation destination — an LFO on a mid band's frequency makes a moving, phaser-like tone; the envelope follower on a hat's HI gain makes it open up with the kick.</p>`],
  ['The FM engine', `<p>Three sine operators for percussion: a <b>carrier</b> at <i>Freq</i> (× Tune), a <b>modulator</b> at <i>Ratio</i> × the carrier, and a second operator at <i>Ratio 2</i>.</p>
<ul><li><b>Algorithms</b> — CLASSIC (modulator → carrier: kicks, toms, bells), STACK (op 2 → modulator → carrier: richer, more aggressive), PARALLEL (both modulators → carrier: complex, noisy), METAL (classic × a ring-modulating op 2: inharmonic cymbals and hits).</li>
<li><b>Index</b> — how strongly the modulator bends the carrier (brightness); <b>Mod decay</b> — how fast that brightness falls after the hit.</li>
<li><b>Feedback</b> — the modulator modulates itself: from grit to noise.</li>
<li><b>Fold</b> — a wavefolder after the carrier: adds harmonics, from warmth to buzz.</li>
<li><b>Noise</b> — a noise layer following the envelope (snares, hats); <b>Click</b> — a short noise transient; <b>Bright</b> scales the index.</li></ul>
<p>Non-whole ratios (1.41, 2.76, 3.5) give metallic, bell-like and inharmonic tones; whole numbers sound tuned.</p>`],
  ['Metalise and LFOs', `<p><b>METALISE</b> lives in the <b>Slicer window</b>, to the right of the Stutter dial. It is the 90s jungle sampler time-stretch: short grains replayed from a source that keeps falling behind, at 12-bit. The grain length rings as a metallic pitch. Turn it <b>ON</b> and set <b>Mix</b>, <b>Grain</b> (3–60 ms: short grains are higher and harsher) and <b>Stretch</b> (lower smears more). It works on the whole kit after the delay and reverb, before the Slicer. (Older kits that used the earlier glitch's Stutter or Reverse modes still play them; pressing Metalise switches them to Metalise.)</p>
<p><b>LFO 1–3</b> (the row along the bottom) each move Metalise's Mix, Grain or Stretch: choose a shape (sine, triangle, saw, square, S&amp;H random), a Depth (it starts at 0 — turn it up), and a Rate in Hz or — with SYNC — a beat division from 4 bars to 1/16. The light shows the LFO moving. The LFOs always run, and are also sources in the modulation matrix: drag the LFO's chip onto any dial (its Metalise Depth doesn't affect the wires).</p>`],
  ['Tape and vinyl', `<p>The <b>TAPE</b> section ages the whole mix, after the Slicer. All three start at OFF.</p>
<ul><li><b>Wow</b> — slow pitch drift, like a stretched cassette (a slow wave plus a random wander, so it never repeats exactly).</li>
<li><b>Flutter</b> — fast, fine wobble from an uneven tape transport.</li>
<li><b>Dust</b> — vinyl crackle and a warm hiss; more Dust means more and louder crackles. It keeps crackling even when nothing plays.</li></ul>
<p>Lo-fi starting point: Wow 30 %, Flutter 25 %, Dust 40 %, Warmth up, track Bits 10–12 and the HI EQ band down a few dB. All three can be modulated — chaos (Drift) on Wow gives a tape that slowly loses its way.</p>`],
  ['Master: TEMPER and HUMANISE', `<p><b>TEMPER</b> changes the character of the whole kit with one dial. At its centre, <b>NEUTRAL</b>, it does nothing at all — the sound passes untouched and it uses no processing. Turn it left for <b>WARM</b>: a gentle, slightly asymmetric saturation (vintage colour), a softer top end and rounder attacks. Turn it right for <b>COLD</b>: a cleaner, harder, more mechanical sound — sharper attacks and a brighter top; near the far right a faint metallic edge. It is not a distortion: even at the ends it stays a colour. Old projects and kits that used <b>Warmth</b> open with the same amount of warm TEMPER.</p>
<p><b>HUMANISE</b> makes the sequencer play like a person. At <b>OFF</b> (0 %) the sequencer plays exactly as written. Up to 25 %: tiny timing differences, felt more than heard. Around 50 %: a relaxed, clearly human feel. From 50 % quiet <b>ghost notes</b> begin to appear on free steps next to your hits; around 75 % the timing is loose and obvious and ghosts are frequent; towards 100 % some ghosts become quick doubles and triples. Your pattern is never changed and ghosts are never recorded; the rhythm always stays recognisable. Mute, solo, chokes and ratchets all still apply.</p>`],
  ['Reverb types', `<p>EFFECTS → <b>Reverb</b> chooses the reverb every track's Reverb send goes to:</p>
<ul><li><b>Room</b> — the original reverb.</li><li><b>Spring</b> — a tank of springs: drippy, twangy, dub.</li>
<li><b>Gate</b> — a dense room cut off after a hold (Size sets it, 60–560 ms): the 80s snare.</li>
<li><b>Expanse</b> — a huge space for slow, ambient and downtempo music. Size sets its length; from 90 % to 95 % (<b>WASH</b>) the tails become long, overlapping, evolving washes; from 95 % to 100 % it approaches a <b>FREEZE</b>, which holds whatever is in the reverb indefinitely (stop sending to it and it hangs in the air).</li></ul>`],
  ['Insert effect (AUv3) and audio input', `<p>In the App Store app, Vektur Drum also appears as an <b>effect</b> (Vektur Drum FX) you can insert on any track or bus in GarageBand, Logic, Cubasis, AUM… The incoming audio goes through the delay and reverb sends, Metalise, the <b>Slicer</b>, tape and TEMPER — with the drums playing too, or with DRUMS OFF as a pure effect. In this web app, <b>Settings → INSERT INPUT</b> does the same with an audio input (use headphones with a microphone). Input sets its level, Delay and Reverb its sends.</p>`],
  ['The Slicer', `<p>The Slicer is the last effect on the master: it records everything you hear and rearranges it in time. Open it with <b>SLICER</b> in the top strip and turn it <b>ON</b>.</p>
<p><b>Cycle and slices:</b> the cycle is <b>1 or 2 bars</b>, cut into slices of <b>1/32, 1/16, 1/8 or 1/4</b> (at most 32). The program has one action per slice; the lit slice is the one playing.</p>
<ul><li><b>THRU</b> — unchanged. <b>REPEAT</b> — plays the slice before again. <b>STUTTER</b> — re-triggers the start of the slice ×2 to ×8 (<i>Stutter</i>).</li>
<li><b>REVERSE</b> — the same slice of the previous cycle, backwards. <b>TAPE STOP</b> — slows to a halt over <i>Tape</i> of the slice. <b>TAPE START</b> — spins up from stopped.</li>
<li><b>PITCH</b> — transposes by <i>Pitch</i> semitones (−24…+24; down slows, up reads ahead from the slice before). <b>SPEED</b> — plays at <i>Speed</i> ×0.25–×2.</li>
<li><b>GATE</b> — silence. <b>PERMUTE</b> — plays another slice in its place (choose which below the palette; an earlier slice comes from this cycle, the same or a later one from the cycle before). <b>SCRATCH</b> — back and forth through the slice before. <b>ECHO</b> — the slice plus the one before, layered.</li></ul>
<p><b>Editing:</b> tap a slice to select it, then tap an action — the selection moves on, so you can type a program. <b>GENERATE</b> fills the program in a style: SUBTLE (mostly through, small moves at bar ends), JUNGLE (repeats, stutters and permutations at 1/16), GLITCH (1/32 stutters, gates, scratches), TAPE (stops at the bar end, spin-ups), CHAOS (anything). SHIFT rotates it, MIRROR reverses its order, CLEAR resets.</p>
<p><b>Mix</b> blends the sliced sound with the original. <b>Density</b> plays only some of the actions (the rest pass through); <b>Evolve</b> replaces some slices with random actions. Both are rolled again every cycle from <b>Seed</b>, so the same seed always gives the same variations — NEW SEED picks another.</p>
<p><b>Hold pads</b> (1–6: Stutter, Reverse, Tape stop, Pitch, Gate, Scratch) take over from the moment you press them until you let go — for live drops and fills. Pressing one also turns the Slicer on.</p>
<p><b>Modulation:</b> every Slicer dial is a destination — drag a source chip onto it. Ideas: a synced LFO on Density for slicing that breathes; Chaos on Evolve for programs that never settle; the envelope follower (kick) on Mix; an S&amp;H LFO on Seed for a new variation every cycle; an LFO on Pitch for tape warble.</p>`],
  ['Modulation', `<p>Five sources can move any dial: <b>LFO 1–3</b>, the <b>Env follower</b> and <b>Chaos</b>. Open the MOD window with <b>MOD</b>.</p>
<ul><li><b>The MOD window</b> floats over the panel: drag its title bar to move it anywhere, drag its bottom corner to resize it, <b>A−</b> / <b>A+</b> scale its contents, <b>—</b> folds it down to just the five source chips (a palette you can park anywhere), <b>◧</b> / <b>◨</b> dock it to the left or right edge and <b>❐</b> floats it again. It remembers where you left it. It also holds the settings of all five sources, LFOs included.</li>
<li><b>Drag and drop</b> — drag a source chip (in the window, on each LFO, or in the Slicer window) onto any dial in the panel or onto a destination in the window's list. Move the window out of the way of the dial you want. The wire appears in the <b>wire list</b>.</li>
<li><b>Tap, then tap</b> — tap a chip, then tap any dial. Tap the chip again or press Esc to cancel. (Docked, the window steps aside while a source is picked.)</li>
<li><b>Wire list</b> — each wire has its source (change it there), its destination, a <b>Depth</b> (−100…+100 %), <b>INV</b> (invert) and ✕ (delete). Up to 32 wires; CLEAR ALL removes them.</li>
<li><b>Destinations</b> — every continuous dial: all track sounds (tune, decay, FM index, fold, EQ…), master, effects, Metalise, the Slicer, tape, the LFOs themselves (LFO rate by chaos!) and the env follower. Wired dials show a pink ring.</li>
<li><b>See it move</b> — every dial a source is moving carries a light on its rim, in the source's colour, showing where the modulation has it right now. The Metalise dials show their own LFOs (Mix, Grain, Stretch) the same way while Metalise is on.</li></ul>
<p>A wire moves a dial by Depth × the source, as a share of the dial's whole travel — so it feels the same on every dial, and never goes past its ends. The dial you see stays where you set it; the modulation is added in the engine. Several wires on one dial add up.</p>
<p><b>Env follower:</b> follows the level of the master or one track (<i>Input</i>), with <i>Attack</i>, <i>Release</i> and <i>Gain</i>. Use it for ducking (negative depth on a pad's level, input the kick), or to make hits push effects. <b>Chaos:</b> LORENZ (smooth, never repeats), LOGISTIC (stepped jumps at <i>Rate</i>), DRIFT (a slow random walk).</p>`],
  ['Kits, presets and banks', `<p><b>PRESETS</b> holds 88 factory kits, <b>INIT · blank kit</b> (every parameter at its default, empty patterns, no samples) and your own. Filter the factory kits by style: IDM, TECHNO, LO-FI &amp; DOWNTEMPO, HARD TRANCE, PSYTRANCE, 80s ELECTRO (808 grooves through the Gate reverb), BREAKBEAT (funk breaks, ghost notes, the Slicer), AMBIENT (slow and sparse, the Expanse reverb, spectral smears and shimmer), or MORE (house, breaks, jungle, D&amp;B, trap and others). The genre kits show off everything: polymeter, ring and fold steps, EQ, Slicer programs, tape and modulation wires — set the tempo to taste (around 125–135 for IDM and techno, 75–90 for lo-fi, 138–150 for trance). The 80s Electro, Breakbeat and Ambient kits bring their own tempo (Ambient 58–84 BPM); in a host the plug-in follows the host's tempo.</p>
<p> A kit is the sound of all tracks, Metalise, the Slicer, modulation wires and effects, the 8 patterns (with their ring steps) and the chain. Tap a kit to load it; tap an empty slot to save the current kit. Kits from Vektur VJ (Vektur Pulse) load into tracks 1–6.</p>
<p><b>YOURS</b> has two kinds of storage:</p>
<ul><li><b>Set</b> — 16 slots saved with the project (they travel with it).</li>
<li><b>Banks 01–20</b> — 20 banks of 99 presets each, kept on this device and available in every project (in the iOS app, shared between the app and the plug-in). Pick a bank in the list or with ◀ ▶; RENAME BANK, EXPORT BANK, SET → BANK (copies the set's kits in), CLEAR BANK. A selected preset can be copied between the set and a bank.</li></ul>
<p><b>Export</b> saves kits (with their samples) as a .json file; <b>Import</b> adds a file's kits to the empty slots of the set or the bank on show. Your MIDI channel is never changed by a kit.</p>`],
  ['MIDI', `<p>Notes on the drum channel (default 10) play the tracks: 36, 38, 42, 46, 39, 45, 37, 56, 49 for tracks 1–9. Every parameter can be moved by a MIDI CC — including the Slicer (its Hold is great on a footswitch), the env follower and chaos: see <b>Settings → Parameters &amp; CC</b> for the full list and the factory map (for example CC 20–28 track levels, CC 51 Metalise mix).</p>
<p><b>MIDI learn:</b> Settings → MIDI → Enable MIDI learn, then tap a knob and move a control on your device. Or press LEARN next to any parameter in the list. Web MIDI works in Chrome and Edge; Safari has none — the App Store app supports MIDI and Bluetooth MIDI.</p>`],
  ['Saving your work', `<p>Everything autosaves in this browser. <b>Settings → PROJECT</b> saves a project file (all sounds (EQ and tape included), patterns with ring and fold steps, chain, tempo, Slicer program, modulation wires, samples and your CC map) and opens one. Turn <b>Include samples</b> on to carry the song complete to another device. Project files from earlier versions open too.</p>
<p><b>In a host</b> (the App Store app's plug-in in GarageBand, Cubasis, AUM, Logic, Drambo…), Vektur Drum saves the same song inside your project: reopening the project brings back every sound, pattern, recorded step, Slicer program, wire, automation value and MIDI CC mapping, and its samples. Each instance keeps its own song. Your banks are shared between the app and the plug-in.</p>`],
  ['Settings', `<ul><li><b>Sample rate</b> — the engine's rate; Device default suits most uses.</li>
<li><b>Latency</b> — LOW for the tightest response, BALANCED, or STABLE if you hear crackles or want to save battery.</li>
<li><b>Battery saving</b> — fewer light updates; the engine sleeps after 20 s stopped and silent.</li>
<li><b>Don't sleep</b> — keeps the screen on while performing.</li>
<li><b>Background audio</b> — keep playing in the background (as far as the browser allows).</li>
<li><b>MIDI input</b>, <b>MIDI learn</b>, and the <b>Parameters &amp; CC</b> list.</li></ul>
<p><b>APPEARANCE</b> — 13 colour themes (Amber, Cyan Lab, Magenta, Lime Acid, Ice, Sunset, Ocean, Ruby, Gold &amp; Ink, Neon Night, Forest, Mono, Dream Temple), or your own: pick the LED colour (lit buttons, steps, pads), the display colour (the displays and selections), the dial arc colour, the chassis tone (graphite, black, midnight blue, warm walnut, plum, moss) and the top strip (brushed aluminium, dark anodised, copper, gold). RESET returns to the theme's own colours. <b>Dial design</b>: Classic, six from Vektur Vocal (Machined, Chrome, Wood, Mecha, Porcelain, Blueprint) and four from Vektur Vortex (Interstellar, Aqua, Scientific, Holo ring). Saved on this device.</p>`],
  ['Tips', `<ul><li>Double-tap a knob to reset it. Drag up and down to turn it; arrow keys work too.</li>
<li>Different track lengths (e.g. 16, 12 and 7) make grooves that evolve over many bars.</li>
<li>Low Chance on hats plus a little Swing keeps a loop alive.</li>
<li>Ratchets ×3 / ×4 on the last hat of a bar make rolls.</li>
<li>For jungle: Slicer JUNGLE at 1/16 with Density 60 % and an S&amp;H LFO on Seed; Akai Metal at 30–50 % mix; per-step FM ratios on a metal track; a ring step with OSC ≈ 900 Hz on the snare.</li>
<li>Keep the Slicer's Mix below 100 % for a parallel, "doubled" feel; at 100 % it replaces the beat.</li>
<li>Chaos (Drift, slow) on a few track Tunes and Decays makes a loop feel played by hand.</li>
<li>Fold on just the accents of a hat or FM track adds bite exactly where you want it; Fold on a kick step gives a distorted downbeat.</li>
<li>Cut the LO band of hats and percussion (−12 dB around 400 Hz) to leave room for the kick — the Techno kits do this.</li>
<li>On iPad: Share → Add to Home Screen gives Vektur Drum its own full-screen icon.</li></ul>

/* ==== settings.js ==== */
/* ============================================================ Vektur Drum — SETTINGS
   Audio engine (sample rate, latency), power (battery saving, don't sleep, background audio), MIDI (input, learn,
   CC map), the parameter & MIDI CC list, the user manual and About. Preferences are this device's (localStorage),
   not part of the project or kits. */
const APP_VERSION = '0.8 (web test build)';
const PREFS_KEY = 'vekturdrum.prefs.v1';
const LATENCY = [['interactive', 'Low', 'Shortest buffer: tightest pads and MIDI. Uses the most power; may crackle on a busy device.'],
  ['balanced', 'Balanced', 'A middle buffer: safe for most devices.'],
  ['playback', 'Stable', 'Longest buffer: the most robust and battery-friendly; pads and MIDI respond later.']];
const RATES = [[0, 'Device default'], [44100, '44.1 kHz'], [48000, '48 kHz'], [88200, '88.2 kHz'], [96000, '96 kHz']];

/* Factory MIDI CC map (any channel). MIDI Learn replaces or adds to it; "Reset CC map" restores it. */
function ccFactory() {
  const m = {}, put = (cc, key) => { m['drums:' + key] = { cc, ch: 0 }; };
  for (let t = 1; t <= 9; t++) { put(19 + t, `t${t}.level`); put(29 + t, `t${t}.tune`); put(39 + t, `t${t}.decay`); put(101 + t, `t${t}.pan`); }
  put(7, 'dr.level'); put(9, 'dr.swing'); put(12, 'dr.temper'); put(16, 'dr.human'); put(13, 'dr.dlyfb'); put(14, 'dr.revsize'); put(15, 'dr.dlytone');
  put(50, 'gl.on'); put(51, 'gl.mix'); put(52, 'gl.size'); put(53, 'gl.speed'); put(54, 'gl.mode');
  put(55, 'lfo1.depth'); put(56, 'lfo2.depth'); put(57, 'lfo3.depth'); put(58, 'lfo1.rate'); put(59, 'lfo2.rate'); put(60, 'lfo3.rate');
  put(61, 'sl.on'); put(62, 'sl.mix'); put(63, 'sl.density'); put(64, 'sl.evolve'); put(65, 'sl.hold'); put(66, 'sl.seed'); put(67, 'sl.pitch'); put(68, 'env.gain'); put(69, 'ch.rate');   // NEW: Slicer, env follower, chaos
  return m;
}
const PREFS = (() => {
  const d = { sampleRate: 0, latency: 'interactive', battery: false, noSleep: false, background: false, midiIn: true, ccMap: ccFactory() };
  try { const o = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null'); if (o && typeof o === 'object') Object.assign(d, o); } catch (e) { }
  if (!LATENCY.some(l => l[0] === d.latency)) d.latency = 'interactive';
  if (!RATES.some(r => r[0] === d.sampleRate)) d.sampleRate = 0;
  if (!d.ccMap || typeof d.ccMap !== 'object') d.ccMap = ccFactory();
  if (d.ccMap['drums:dr.warmth'] && !d.ccMap['drums:dr.temper']) { d.ccMap['drums:dr.temper'] = d.ccMap['drums:dr.warmth']; } delete d.ccMap['drums:dr.warmth'];   // 0.8: Warmth → TEMPER
  return d;
})();
function prefsSave() { try { localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); } catch (e) { } }
const SET = { tab: 'audio', learnKey: null, ccDirty: false, lastCC: null, midiPorts: [], wake: null, idleSince: 0, sleeping: false, ccIndex: null };

// ---- audio engine: sample rate and latency need a new audio context (the engine is rebuilt, the music is kept)
function audioContextOptions() { const o = { latencyHint: PREFS.latency }; if (PREFS.sampleRate) o.sampleRate = PREFS.sampleRate; return o; }
async function rebuildAudio() {
  const wasPlaying = !!(SYN.dtel && SYN.dtel[0] > 0);
  if (A.ctx) { try { await A.ctx.close(); } catch (e) { } }
  A.ctx = null; SYN.node = null; SYN.loading = null; SYN.dtel = null; DRM.tel = null; DSMP.sent = '';
  audioEnsure(); const ok = await synthStart();
  if (ok && wasPlaying) drumPost(['z', 1]);
  toast(ok ? `Audio engine: ${(A.ctx.sampleRate / 1000).toFixed(1)} kHz, ${LATENCY.find(l => l[0] === PREFS.latency)[1].toLowerCase()} latency` : 'The audio engine could not restart');
  if (settingsOpen()) renderSettings();
}
function latencyText() {
  if (!A.ctx) return 'Starts on your first tap.';
  const b = A.ctx.baseLatency, o = A.ctx.outputLatency, ms = x => (x * 1000).toFixed(1) + ' ms';
  return `Running at ${(A.ctx.sampleRate / 1000).toFixed(1)} kHz · buffer ${b ? ms(b) : '—'}${o ? ' · output ' + ms(o) : ''} · engine: ${SYN.mode === 'worklet' ? 'AudioWorklet (audio thread)' : SYN.mode === 'script' ? 'compatibility (main thread)' : '—'}`;
}

// ---- power
async function wakeLockApply() {
  if (PREFS.noSleep && !document.hidden) {
    if (SET.wake) return;
    if (!('wakeLock' in navigator)) { toast("This browser can't keep the screen awake"); return; }
    try { SET.wake = await navigator.wakeLock.request('screen'); SET.wake.addEventListener('release', () => { SET.wake = null; }); }
    catch (e) { toast('Keeping the screen awake was refused here'); }
  } else if (!PREFS.noSleep && SET.wake) { try { await SET.wake.release(); } catch (e) { } SET.wake = null; }
}
function mediaSessionApply() {
  try { if ('mediaSession' in navigator && PREFS.background) navigator.mediaSession.metadata = new MediaMetadata({ title: 'Vektur Drum', artist: 'DMT Cymatics — Dream Music Temple' }); } catch (e) { }
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (!PREFS.background && A.ctx && A.ctx.state === 'running') A.ctx.suspend().catch(() => { }); }
  else { if (A.ctx && !SET.sleeping) audioEnsure(); wakeLockApply(); }
});
/** Battery saving: LEDs at a quarter of the frame rate; audio sleeps after 20 s stopped and silent (wakes on a tap or a note). */
function batteryTick(now) {
  if (!PREFS.battery || !A.ctx) { SET.idleSince = 0; return; }
  const tel = SYN.dtel, idle = !tel || (tel[0] === 0 && tel[3] < 0.002);
  if (!idle || SET.sleeping) { if (!idle) SET.idleSince = 0; return; }
  if (!SET.idleSince) SET.idleSince = now;
  if (now - SET.idleSince > 20000 && A.ctx.state === 'running') { SET.sleeping = true; A.ctx.suspend().catch(() => { }); }
}
function audioWake() { if (SET.sleeping) { SET.sleeping = false; SET.idleSince = 0; } }
document.addEventListener('pointerdown', audioWake, true);

// ---- MIDI: notes on the drum channel play the drums; CCs move mapped parameters; MIDI Learn maps the next CC
function ccIndex() {
  if (SET.ccIndex) return SET.ccIndex;
  const ix = {}; for (const [path, m] of Object.entries(PREFS.ccMap)) { const k = m.cc; (ix[k] = ix[k] || []).push([path, m.ch]); }
  return (SET.ccIndex = ix);
}
function ccAssign(path, cc, ch) {
  for (const [p, m] of Object.entries(PREFS.ccMap)) if (m.cc === cc && (m.ch === ch || !m.ch || !ch)) delete PREFS.ccMap[p];   // one control → one parameter
  PREFS.ccMap[path] = { cc, ch }; SET.ccIndex = null; prefsSave();
}
function ccClear(path) { delete PREFS.ccMap[path]; SET.ccIndex = null; prefsSave(); }
function vdMidi(st, d1, d2) {
  if (!PREFS.midiIn) return;
  if (st >= 0xF0) return;
  const type = st & 0xF0, ch = (st & 0x0F) + 1;
  if (type === 0xB0) {
    SET.lastCC = { cc: d1, ch, v: d2 };
    const target = SET.learnKey || (midiLearn ? learnPath : null);
    if (target) {
      ccAssign(target, d1, 0); toast(`CC ${d1} → ${paramLabel(target.slice(6))}`);
      SET.learnKey = null; learnPath = null; if (settingsOpen()) renderSettings(); SET.ccDirty = true; return;
    }
    const hits = ccIndex()[d1]; if (!hits) return;
    for (const [path, mch] of hits) if (!mch || mch === ch) { drumSetNorm(path.slice(6), d2 / 127); SET.ccDirty = true; }
    return;
  }
  if (type === 0x90 && d2 > 0) { audioWake(); if (A.ctx && A.ctx.state !== 'running') audioEnsure(); }
  drumsTakeMidi(st, d1, d2);
}
function midiPortsUpdate(acc) { SET.midiPorts = []; acc.inputs.forEach(i => SET.midiPorts.push(i.name || 'MIDI input')); if (settingsOpen() && SET.tab === 'midi') renderSettings(); }

// ---- names
function paramLabel(key) {
  const q = DRUM_PARAMS[DP_ID[key]]; if (!q) return key;
  const m = key.match(/^t(\d)\./); return m ? `Track ${m[1]} · ${q[1]}` : `${q[2] === 'Master' ? '' : q[2] + ' · '}${q[1]}`;
}
function paramRange(q) {
  if (q[3] === 'enum') return q[9].join(' / ');
  if (q[3] === 'bool') return 'off / on';
  return `${drumFmt(q, q[4])} … ${drumFmt(q, q[5])}`;
}

/* NEW (0.8): the insert input (web): the device's audio input into the engine's input. */
const INS = { stream: null, src: null };
async function insertStart() {
  try {
    if (!(await synthStart()) || !SYN.node || SYN.mode !== 'worklet') { toast('The insert needs the AudioWorklet engine'); return; }
    INS.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 2 } });
    INS.src = A.ctx.createMediaStreamSource(INS.stream); INS.src.connect(SYN.node);
    if (!drumState().on) await drumsSetOn(true);
    toast('Insert on: the input runs through the effects');
  } catch (e) { INS.stream = null; toast('No audio input: ' + (e.message || e)); }
}
async function insertStop() { try { if (INS.src) INS.src.disconnect(); if (INS.stream) INS.stream.getTracks().forEach(tr => tr.stop()); } catch (e) { } INS.src = INS.stream = null; toast('Insert off'); }

/* ==== state.js ==== */
/* ============================================================ Vektur Drum — STATE (vektur-drum-state v1)
   One format for everything that saves a song: this web app's project files and autosave, the iPad/iPhone app's
   documents, and the AUv3's state inside GarageBand, Cubasis, AUM, Logic… (AUAudioUnit.fullState). Spec:
   docs/STATE.md. Rules: every value is written (so a song sounds the same after an update changes a default);
   parameters by key (stable across versions); reading never trusts the file (unknown keys ignored, everything
   clamped, missing → default); older files and Vektur VJ sets are read too. */
const STATE_FORMAT = 'vektur-drum-state', STATE_VERSION = 5;   // v5: master TEMPER (replaces Warmth: old value w → −w) and HUMANISE · v4: step pitch shift + spectral (values 16–20), reverb type, insert input parameters ·   // v2: slicer program, modulation wires, ring fields on steps (14 values) · v3: step fold (15th value), EQ and tape parameters; v1/v2 open
const MOD_SRC_IDS = ['lfo1', 'lfo2', 'lfo3', 'env', 'chaos'];

/** The current song as a vektur-drum-state object. embed: include the sample files (portable song). */
function stateBuild(opts = {}) {
  const d = drumState();
  const params = {}; DRUM_PARAMS.forEach(q => { params[q[0]] = drumVal(q[0]); });
  const patterns = d.pats.slice(0, 8).map(pt => ({ bars: pt.bars,
    tracks: pt.tr.slice(0, DRUM_TRACKS).map(tr => ({ len: tr.len, div: tr.div, steps: tr.s.slice(0, 16).map(s => { if (!s) return null; const v = drumStepFull(s.slice()); return v.length > 15 && (v[15] !== 0 || v[17] > 0) ? v.slice(0, 20) : v.length > 14 && v[14] > 0 ? v.slice(0, 15) : v.length > 9 && v[9] > 0 ? v.slice(0, 14) : v.slice(0, 9); }) })) }));
  const samples = drumSmp().slice(0, DRUM_TRACKS).map(k => { const f = k && drumLib().find(x => x.key === k); return f ? { key: f.key, name: f.name } : null; });
  const ccMap = {}; for (const [path, m] of Object.entries(PREFS.ccMap)) if (path.startsWith('drums:')) ccMap[path.slice(6)] = { cc: m.cc, ch: m.ch || 0 };
  const o = { format: STATE_FORMAT, version: STATE_VERSION, writer: 'Vektur Drum ' + APP_VERSION,
    project: { tempo: S.bpm, trackCount: d.ntr, selected: d.sel, chain: d.chain.slice(0, 16), chainOn: !!d.chainOn, kit: d.preset || '', params, patterns, samples,
      slicer: drumSliceProg().map(s => s.slice()), wires: drumWires().map(w => ({ source: MOD_SRC_IDS[w.s], param: w.k, amount: Math.round(w.a * 1e4) / 1e4 })) },
    midi: { ccMap } };
  if (opts.embed) { const keys = new Set(samples.filter(Boolean).map(s => s.key)); o.sampleData = drumLib().filter(f => keys.has(f.key) && f.data).map(f => ({ key: f.key, name: f.name, fmt: f.fmt, data: f.data })); }
  return o;
}

/** Puts a saved song into the app. Accepts vektur-drum-state, the earlier autosave format and Vektur VJ sets.
    Returns { warnings: [...] }; throws Error with a message for files that aren't songs at all. */
function stateApply(o, opts = {}) {
  const warnings = [];
  if (!o || typeof o !== 'object') throw new Error('That file is not a Vektur Drum project.');
  let pr;
  if (o.format === STATE_FORMAT) {
    if (+o.version > STATE_VERSION) warnings.push('Saved by a newer Vektur Drum: anything this version doesn\'t know is skipped.');
    pr = o.project && typeof o.project === 'object' ? o.project : {};
  } else if (o.app === 'vektur-drum' && o.drums) pr = legacyProject(o.drums, o.bpm);                    // autosave before v1
  else if (o.drums && typeof o.drums === 'object' && (o.drums.pats || o.drums.p)) { pr = legacyProject(o.drums, o.bpm); warnings.push('Opened the drums of a Vektur VJ set.'); }
  else if (o.format === 'vektur-pulse-presets') throw new Error('That is a kit file — open it in PRESETS → Import.');
  else throw new Error('That file is not a Vektur Drum project.');
  // sample files carried in the file → the library (bytes are stored in IndexedDB by drumSamplesSync)
  for (const f of Array.isArray(o.sampleData) ? o.sampleData : []) {
    if (!f || typeof f.key !== 'string' || typeof f.data !== 'string' || drumLib().some(x => x.key === f.key)) continue;
    drumLib().push({ key: f.key.slice(0, 24), name: String(f.name || 'Sample').slice(0, 40), fmt: f.fmt === 'flac' ? 'flac' : 'wav', data: f.data });
  }
  for (const f of (o.library && Array.isArray(o.library.samples)) ? o.library.samples : [])   // autosave: names; bytes are in IndexedDB
    if (f && typeof f.key === 'string' && !drumLib().some(x => x.key === f.key)) drumLib().push({ key: f.key.slice(0, 24), name: String(f.name || 'Sample').slice(0, 40), fmt: f.fmt === 'flac' ? 'flac' : 'wav' });
  const st = drumState();
  const num = (x, a, b, def) => Number.isFinite(+x) ? Math.min(b, Math.max(a, +x)) : def;
  const P = pr.params && typeof pr.params === 'object' ? pr.params : {};
  st.p = drumMigrateParams(presetCleanP('drums', P), Array.isArray(pr.samples) ? pr.samples.map(s => s && s.key) : null);
  if (P['dr.ch'] != null && Number.isFinite(+P['dr.ch'])) st.p['dr.ch'] = Math.round(num(P['dr.ch'], 0, 16, 10));
  S.bpm = Math.round(num(pr.tempo, 40, 240, 120) * 10) / 10;
  st.ntr = Math.round(num(pr.trackCount, 6, DRUM_TRACKS, DRUM_TRACKS));
  const pats = Array.isArray(pr.patterns) ? pr.patterns : [];
  st.pats = [0, 1, 2, 3, 4, 5, 6, 7].map(i => presetCleanPattern(toLegacyPattern(pats[i])));
  st.chain = (Array.isArray(pr.chain) ? pr.chain : []).slice(0, 16).map(c => Math.round(num(c, 0, 7, 0)));
  st.chainOn = !!pr.chainOn; st.sel = Math.round(num(pr.selected, 0, 7, 0));
  st.preset = typeof pr.kit === 'string' ? pr.kit.slice(0, 60) : '';
  st.slice = drumSliceClean(pr.slicer);   // v1: a clear program
  st.wires = drumWiresClean((Array.isArray(pr.wires) ? pr.wires : []).map(w => w && ({ s: MOD_SRC_IDS.indexOf(w.source), k: w.param, a: w.amount })).filter(w => w && w.s >= 0));
  st.smp = Array.from({ length: DRUM_TRACKS }, (_, i) => {
    const s = Array.isArray(pr.samples) ? pr.samples[i] : null; if (!s || typeof s.key !== 'string') return null;
    if (drumLib().some(f => f.key === s.key)) return s.key;
    warnings.push(`Track ${i + 1}: the sample “${String(s.name || s.key).slice(0, 40)}” is not on this device (save with samples included to carry it).`);
    return null;
  });
  if (opts.library && Array.isArray(opts.library.userKits)) st.user = opts.library.userKits.slice(0, PRESET_SLOTS).map(x => x ? presetClean('drums', x) : null);
  const cc = o.midi && o.midi.ccMap && typeof o.midi.ccMap === 'object' ? o.midi.ccMap : null;
  if (cc && opts.midi !== false) {
    const m = {}; for (let [k, v] of Object.entries(cc)) { if (k === 'dr.warmth') k = 'dr.temper'; if (DP_ID[k] != null && v && Number.isInteger(+v.cc) && +v.cc >= 0 && +v.cc < 128) m['drums:' + k] = { cc: +v.cc, ch: Math.round(num(v.ch, 0, 16, 0)) }; }
    PREFS.ccMap = m; SET.ccIndex = null; prefsSave();
  }
  DSMP.sent = '';
  return { warnings };
}
function toLegacyPattern(pt) {   // v1 {bars, tracks:[{len, div, steps}]} → the app's {bars, tr:[{len, div, s}]} (then cleaned)
  if (!pt || typeof pt !== 'object') return null;
  if (Array.isArray(pt.tr)) return pt;
  return { bars: pt.bars, tr: (Array.isArray(pt.tracks) ? pt.tracks : []).map(tr => tr && typeof tr === 'object' ? { len: tr.len, div: tr.div, s: tr.steps } : null) };
}
function legacyProject(d, bpm) {
  return { tempo: bpm, trackCount: d.ntr || 6, selected: d.sel, chain: d.chain, chainOn: d.chainOn, kit: d.preset, params: d.p || {}, patterns: d.pats,
    samples: Array.isArray(d.smp) ? d.smp.map(k => typeof k === 'string' ? { key: k, name: k } : null) : [] };
}
/** After a song is applied: the engine, the panel, the sample bytes. */
function stateAfterApply() {
  drumPushAll(); if (SYN.node) drumPost(['z', 0]);
  if (drumsOpen()) renderDrums();
  dirty();
}

// ---- project files (Settings → PROJECT)
const PROJ = { embed: true };
function projectSave() {
  const o = stateBuild({ embed: PROJ.embed }), text = JSON.stringify(o);
  const name = (drumState().preset || 'Vektur Drum project').replace(/[^\w-]+/g, '_') + '.vdrum.json';
  downloadText(text, name, 'application/json');
}
function projectOpen() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,.vdrum,application/json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    try {
      const r = stateApply(JSON.parse(await f.text()));
      stateAfterApply(); renderSettings();
      toast(r.warnings.length ? r.warnings[0] : 'Project opened');
      if (r.warnings.length > 1) console.warn(r.warnings);
    } catch (e) { toast(e instanceof SyntaxError ? 'That file is not a Vektur Drum project.' : e.message); }
  };
  inp.click();
}
function setProject(b) {
  const s = sec('PROJECT'); b.appendChild(s);
  const box = el('div', 'setchoice');
  box.appendChild(hbtn('SAVE PROJECT…', 'sm', projectSave)); box.appendChild(hbtn('OPEN PROJECT…', 'sm', projectOpen));
  setRow(s, 'Project file', 'Everything about this song in one file: all sound settings, the 8 patterns, chain, track count, tempo, samples and your MIDI CC map. The same format the App Store app and the plug-in save inside GarageBand, Cubasis, AUM and Logic.', box);
  setRow(s, 'Include samples', 'Puts the track samples inside the file, so the song opens complete on any device. Off: smaller file; samples must already be on the device that opens it.',
    setToggle(PROJ.embed, () => { PROJ.embed = !PROJ.embed; renderSettings(); }, 'Include samples'));
  const o = stateBuild({ embed: PROJ.embed }), size = JSON.stringify(o).length;
  const used = o.project.samples.filter(Boolean).length;
  s.appendChild(el('div', 'oled setoled', `Format ${STATE_FORMAT} v${STATE_VERSION} · ${(size / 1024).toFixed(size < 102400 ? 1 : 0)} KB · ${used} sample${used === 1 ? '' : 's'}${PROJ.embed && used ? ' included' : ''}\nAutosave: on (this browser) · kit: ${drumState().preset || '—'}`));
}

/* ==== host.js ==== */
/* Vektur Drum — web host: audio, clock, project save, MIDI in, iPad behaviour.
   Replaces exactly the Vektur VJ services the drum code calls, and nothing more:
     audio context + worklet (audioEnsure, synthStart, synthMidi, SYN)   · project state + autosave (S, dirty)
     sample byte store (filePut, fileGet → IndexedDB)                     · file download (downloadText)
     tempo (S.bpm + the TEMPO knob)                                       · Web MIDI input → drumsTakeMidi
     the per-frame UI tick (drumsTick)                                    · knob hooks Vektur VJ uses for MIDI learn
   Musical timing never runs here: the sequencer clock is inside the AudioWorklet. This file only paints LEDs. */

const VD_KEY = 'vekturdrum.project.v1';
const S = { bpm: 120, drums: null, drumSamples: [] };
const A = { ctx: null };
const SYN = { node: null, loading: null, dtel: null, dead: false };
const SPECTRA_NAME = 'Vektur Spectra';   // only named in a preset-import error message ("that file holds synth presets")
const macroCatch = () => false;
let VD_FRAMED = false; try { VD_FRAMED = window.self !== window.top; } catch (e) { VD_FRAMED = true; }
if (VD_FRAMED) {   // the hosted preview's sandbox refuses dialogs: save under the suggested name, confirm replacing
  window.prompt = (msg, def) => def != null ? String(def) : '';
  window.confirm = () => true;
}          // Vektur VJ macros / MIDI learn are not part of Vektur Drum (see the report)

// ---- audio
function audioEnsure() {
  if (A.ctx) { if (A.ctx.state !== 'running' && A.ctx.state !== 'closed') A.ctx.resume().catch(() => { }); return; }   // iOS: 'suspended' or 'interrupted'
  // Safari 16.4+: play like a music app — not silenced by the ring/silent switch
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  try { A.ctx = new AC(audioContextOptions()); }   // Settings → sample rate and latency
  catch (e) { A.ctx = new AC({ latencyHint: PREFS.latency }); toast('That sample rate is not available here: using the device rate'); }
}
function drumProcessorSource() {
  return `const DRUM_PARAMS=${JSON.stringify(DRUM_PARAMS)}, DRUM_DIV_BEATS=${JSON.stringify(DRUM_DIV_BEATS)}, DRUM_NOTES=${JSON.stringify(DRUM_NOTES)}, DRUM_DEF_DIV=${DRUM_DEF_DIV};
${drumsMakeEngine.toString()}
${$('#vd-worklet').textContent}`;
}
function hostOnMessage(data) { SYN.dtel = data.dtel; if (data.drec) drumApplyRecorded(data.drec); }
/** AudioWorklet (audio thread). Throws if the browser or the page's security policy doesn't allow it. */
async function startWorklet() {
  if (!A.ctx.audioWorklet || typeof AudioWorkletNode === 'undefined') throw new Error('no AudioWorklet');
  const src = drumProcessorSource();
  const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
  try { await A.ctx.audioWorklet.addModule(url); }
  catch (e) { await A.ctx.audioWorklet.addModule('data:application/javascript;charset=utf-8,' + encodeURIComponent(src)); }
  finally { URL.revokeObjectURL(url); }
  const n = new AudioWorkletNode(A.ctx, 'vektur-drum', { numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2] });   // NEW (0.8): one input — the insert source
  n.onprocessorerror = () => { SYN.dead = true; toast('Audio engine stopped'); };
  n.port.onmessage = e => hostOnMessage(e.data);
  SYN.mode = 'worklet';
  return n;
}
/** Fallback: the same processor class on a ScriptProcessorNode (main thread). Timing is still sample-accurate —
    the sequencer counts samples inside the callback — but a busy UI can cause dropouts. Test builds only. */
function startScriptProcessor() {
  sampleRate = A.ctx.sampleRate;
  const proc = new VD_PROCESSOR(), sp = A.ctx.createScriptProcessor(512, 0, 2);
  proc.port.toHost = hostOnMessage;
  sp.onaudioprocess = e => { const ob = e.outputBuffer; proc.process([], [[ob.getChannelData(0), ob.getChannelData(1)]]); };
  SYN.mode = 'script';
  return { port: { postMessage: m => proc.port.onmessage && proc.port.onmessage({ data: m }) }, connect: d => sp.connect(d) };
}
/** Same contract as Vektur VJ's synthStart(): resolves true once the engine node exists. */
async function synthStart() {
  audioEnsure(); if (!A.ctx) { toast('This browser has no Web Audio'); return false; }
  if (SYN.node) return true;
  if (!SYN.loading) SYN.loading = (async () => {
    let n;
    try { n = await startWorklet(); }
    catch (e) { console.warn('AudioWorklet unavailable, using ScriptProcessor fallback:', e); n = startScriptProcessor(); }
    n.connect(A.ctx.destination);
    SYN.node = n; n.port.postMessage({ tempo: S.bpm }); drumPushAll();
  })().catch(err => { SYN.loading = null; console.error(err); toast('The audio engine could not start'); });
  await SYN.loading; return !!SYN.node;
}
function synthMidi(st, d1, d2) { if (SYN.node) SYN.node.port.postMessage({ m: [st, d1, d2] }); }

// ---- tempo (Vektur VJ: the set's clock; here: our own)
function setBpm(v) { S.bpm = Math.round(clamp(+v || 120, 40, 240) * 10) / 10; if (SYN.node) SYN.node.port.postMessage({ tempo: S.bpm }); paintOled(); dirty(); }
function hostTempoKnob(host) {
  slider(host, { knob: true, label: 'Tempo', min: 40, max: 240, def: 120, step: .5, get: () => S.bpm, set: setBpm, fmt: v => v.toFixed(1) });
}

// ---- project: autosave to localStorage; sample bytes in IndexedDB (as in Vektur VJ)
let saveTimer = 0;
function serialize() {   // autosave: the song (vektur-drum-state, sample bytes stay in IndexedDB) + this device's library
  const o = stateBuild({ embed: false });
  o.library = { userKits: drumState().user || [], samples: drumLib().map(f => ({ key: f.key, name: f.name, fmt: f.fmt })) };
  return JSON.stringify(o);
}
function dirty() { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem(VD_KEY, serialize()); } catch (e) { } }, 400); }
/** Autosave → the app (also reads the earlier autosave format). */
function loadProject() {
  let o = null; try { o = JSON.parse(localStorage.getItem(VD_KEY) || 'null'); } catch (e) { }
  if (!o) return;
  try {
    const lib = o.library || (o.drums ? { userKits: o.drums.user, samples: o.drumSamples } : null);
    if (lib && Array.isArray(lib.samples)) o.library = { userKits: lib.userKits, samples: lib.samples };
    stateApply(o, { library: o.library, midi: false });   // the device's CC map is already in PREFS
  } catch (e) { console.warn('autosave not loaded:', e.message); }
  drumState().on = false;   // audio starts on the first tap (browser autoplay rules); PLAY turns the drums on
}
const IDB = { db: null };
function idb() {
  if (IDB.db) return Promise.resolve(IDB.db);
  return new Promise((res, rej) => { const r = indexedDB.open('vekturdrum', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(IDB.db = r.result); r.onerror = () => rej(r.error); });
}
async function filePut(key, blob, name) { const db = await idb(); await new Promise((res, rej) => { const t = db.transaction('files', 'readwrite'); t.objectStore('files').put({ blob, name }, key); t.oncomplete = res; t.onerror = () => rej(t.error); }); return key; }
async function fileGet(key) { try { const db = await idb(); return await new Promise(res => { const q = db.transaction('files', 'readonly').objectStore('files').get(key); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); }); } catch (e) { return null; } }
function downloadText(text, name, type) {
  if (VD_FRAMED && navigator.clipboard) {   // the hosted preview refuses downloads: hand over the file's text instead
    navigator.clipboard.writeText(text).then(() => toast(name + ' copied — paste it into a .json file'), () => toast('Export is not available in this preview'));
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// ---- MIDI in (Vektur VJ routes its MIDI handler through drumsTakeMidi; so do we)
let midiAccess = null;
function midiInit() {
  if (!PREFS.midiIn || !navigator.requestMIDIAccess || midiAccess) return;
  navigator.requestMIDIAccess().then(acc => {
    midiAccess = acc;
    const hook = () => { acc.inputs.forEach(i => { i.onmidimessage = e => { const [st, d1 = 0, d2 = 0] = e.data; vdMidi(st, d1, d2); }; }); midiPortsUpdate(acc); };
    hook(); acc.onstatechange = hook;
  }).catch(() => { });
}

// ---- iPad / touch: size the panel to the screen (touch targets ≈ 40 pt on iPad), keep gestures for the instrument
function fitScale() {
  const touch = matchMedia('(pointer: coarse)').matches, w = document.documentElement.clientWidth;
  const s = touch && w >= 700 ? Math.min(1.35, Math.max(1, w / 1060)) : 1;
  document.documentElement.style.setProperty('--scale', s.toFixed(3));
}
fitScale(); addEventListener('resize', fitScale); addEventListener('orientationchange', fitScale);
['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('pointerdown', () => { if (A.ctx && A.ctx.state !== 'running') audioEnsure(); }, true);

// ---- boot: the panel is the app
let frameN = 0;
function frame(now) {
  try {
    if (!PREFS.battery || (++frameN & 3) === 0) drumsTick();   // battery saving: lights at a quarter of the frame rate
    if (SET.ccDirty) { SET.ccDirty = false; if (drumsOpen()) renderDrums(); }   // knobs moved by MIDI CC
    batteryTick(now || performance.now());
  } catch (e) { console.error(e); }
  requestAnimationFrame(frame);
}
loadProject(); drumState();
openDrums();
document.addEventListener('pointerdown', () => { audioEnsure(); synthStart(); midiInit(); }, { once: true, capture: true });
wakeLockApply(); mediaSessionApply();
requestAnimationFrame(frame);


</script>
